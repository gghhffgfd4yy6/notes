# Sourcery 云端评审配置（https://docs.sourcery.ai/Configuration/）：
# vendor 文件不入评审面。htm-preact.module.js 是 preact+htm standalone 上游产物
# （为免构建直接入库），其内部的 innerHTML/document.write/动态属性访问是框架
# DOM diff 的实现细节，页面不向其传递任何用户净输入——评审与安全规则只应扫我们自己的代码。
version: '1'
ignore:
  - 'scripts/console-assets/htm-preact.module.js'
  # flatpickr 4.6.13 上游产物，同上：只评审我们自己的代码。
  - 'scripts/console-assets/flatpickr.module.js'
  # v3.360 动效库上游产物（motion/mini 14.6.0、@formkit/auto-animate 0.10.0）：
  # esbuild 单文件 bundle，压缩后的字面量/随机数用法是库实现，非本仓代码。
  - 'scripts/console-assets/motion-lib.module.js'
  - 'scripts/console-assets/auto-animate.module.js'
