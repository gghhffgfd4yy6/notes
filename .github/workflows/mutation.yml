name: Mutation

# 变异测试：全量生产代码覆盖。
# 长文件按官方行范围语法（file:start-end）拆分防超时：V3 拆 5 段、sendnotify 拆 2 段。
# ⚠️ v3.270 教训：行段硬编码曾静默漏测尾部新增代码（4495-4924 未变异）。
# 修改大文件后必须同步重拆行段；AGENTS.md 有具体步骤，改动前跑
#   node scripts/check-mutation-ranges.js
# 可校验行段是否覆盖文件全量（含文件增长检测）。
# 增量模式：每 job 独立缓存（reports/inc-*.json），首次全量、之后只跑 diff 部分。
# 免费 runner 单任务上限 6h——每段预估 1-2h，余量充足。
# 触发方式：workflow 文件变更 push、手动（Actions → Mutation → Run workflow）和每日自动。
# 主任务避开 UTC 整点：北京时间 00:17 = UTC 16:17；北京时间 12:17 仅在当天无成功或进行中主任务时补跑。
on:
  push:
    paths:
      - '.github/workflows/mutation.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 16 * * *'
    - cron: '17 4 * * *'

jobs:
  # GitHub schedule 是尽力调度。中午补偿任务查询同日任意触发方式下成功或未完成的运行，
  # 避免重复执行手动/push 触发的变异测试；主 cron、手动和 push 始终运行。
  decide-run:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          # 只有中午补偿 cron 需要判定；其他 schedule 新旧主任务均默认执行，避免主 cron 双点维护。
          if [ "$EVENT_NAME" != "schedule" ] || [ "$SCHEDULE" != "17 4 * * *" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TODAY_SH=$(TZ=Asia/Shanghai date +%F)
          START=$(TZ=Asia/Shanghai date -d "$TODAY_SH 00:00:00" +%s)
          END=$((START + 86400))
          # GitHub 返回 UTC createdAt，按上海自然日的 epoch 边界比较，不能直接做日期字符串前缀匹配。
          # 排除当前补偿运行本身；已有成功结果或任意未完成的同日运行时都不补跑，避免重叠或重复。
          RUNS=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow mutation.yml --limit 100 --json databaseId,createdAt,status,conclusion)
          ACTIVE_OR_SUCCESS=$(printf '%s' "$RUNS" | jq --argjson start "$START" --argjson end "$END" --arg current "$CURRENT_RUN_ID" \
            '[.[] | select((.databaseId | tostring) != $current and (.createdAt | fromdateiso8601) >= $start and (.createdAt | fromdateiso8601) < $end and (.conclusion == "success" or .status != "completed"))] | length')
          if [ "$ACTIVE_OR_SUCCESS" -gt 0 ]; then
            echo "当天已有成功或未完成的 Mutation，跳过中午补偿"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "当天没有成功或未完成的 Mutation，执行中午补偿"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  prepare-re2:
    needs: decide-run
    if: needs.decide-run.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci --ignore-scripts

      # Node 24/Linux x64 的 re2 二进制供全部 mutation 矩阵任务复用；下载失败时自动回退源码构建。
      - name: 安装并验证 re2 原生模块
        run: |
          (cd node_modules/re2 && npm_package_json="$PWD/package.json" node ../install-artifact-from-github/bin/install-from-cache.js --artifact build/Release/re2.node --host-var RE2_DOWNLOAD_MIRROR --skip-path-var RE2_DOWNLOAD_SKIP_PATH --skip-ver-var RE2_DOWNLOAD_SKIP_VER --force-build-var RE2_DOWNLOAD_FORCE_BUILD)
          node -e "const RE2 = require('re2'); const re = new RE2('^ok$'); if (!re.test('ok')) process.exit(1); console.log('re2 native module loaded')"

      - name: 上传 re2 原生模块
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: re2-node24-linux-x64
          path: node_modules/re2/build/Release/re2.node
          if-no-files-found: error
          retention-days: 1

  mutation:
    needs: [decide-run, prepare-re2]
    if: needs.decide-run.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # V3 入口及拆分模块
          - name: v3-entry
            src: "xbk_function_v3.js"
            mutate: "xbk_function_v3.js:1-426"
          - name: app
            src: "xbk_app.js"
            mutate: "xbk_app.js"
          - name: filter
            src: "xbk_filter.js"
            mutate: "xbk_filter.js"
          - name: formatter
            src: "xbk_formatter.js"
            mutate: "xbk_formatter.js"
          - name: message-store
            src: "xbk_message_store.js"
            mutate: "xbk_message_store.js"
          - name: network
            src: "xbk_network.js"
            mutate: "xbk_network.js"
          - name: pusher
            src: "xbk_pusher.js"
            mutate: "xbk_pusher.js"
          - name: rules
            src: "xbk_rules.js"
            mutate: "xbk_rules.js"
          - name: utils
            src: "xbk_utils.js"
            mutate: "xbk_utils.js"
          # sendnotify（1473 行）拆 2 段
          - name: sendnotify-part1
            src: "xbk_sendNotify_slim.js"
            mutate: "xbk_sendNotify_slim.js:1-750"
          - name: sendnotify-part2
            src: "xbk_sendNotify_slim.js"
            mutate: "xbk_sendNotify_slim.js:751-1473"
          # 小文件各一任务
          - name: failure-policy
            src: "xbk_failure_policy.js"
            mutate: "xbk_failure_policy.js"
          - name: storage
            src: "xbk_storage.js"
            mutate: "xbk_storage.js"
          - name: agents
            src: "xbk_agents.js"
            mutate: "xbk_agents.js"
          - name: http
            src: "xbk_http.js"
            mutate: "xbk_http.js"
          - name: loop
            src: "xbk_loop.js"
            mutate: "xbk_loop.js"
          - name: qinglong-push
            src: "qinglong/xbk_push.js"
            mutate: "qinglong/xbk_push.js"
          - name: check-deps
            src: "scripts/check-deps.js"
            mutate: "scripts/check-deps.js"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: 恢复增量缓存
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          # 主 key 用源码+变异配置内容指纹（可命中）；src 单列（mutate 里的 1-750 段范围字面量不可作
          # hashFiles 参数——按字面量找不到文件会返回空指纹，导致 range 段的缓存永不过期）。
          # 注意：key 有意不含 test_*.js —— Stryker 的 command runner 只支持 coverageAnalysis:'off'，
          # 无法感知「测试变化」（incremental-differ 在无覆盖信息时直接复用全部旧结果），把测试指纹并进 key
          # 只会多存一份等价缓存、加剧缓存淘汰而不提质。
          # restore-keys 兜底到该段任意最近缓存，作为增量基线（不是精确恢复）。
          path: reports
          key: stryker-${{ matrix.name }}-${{ hashFiles('package-lock.json', 'stryker.config.js', 'run_mutation.js', matrix.src) }}
          restore-keys: |
            stryker-${{ matrix.name }}-

      - name: 安装依赖
        run: npm ci --ignore-scripts

      - name: 下载 re2 原生模块
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: re2-node24-linux-x64
          path: node_modules/re2/build/Release

      - name: 验证 re2 原生模块
        run: |
          node -e "const RE2 = require('re2'); const re = new RE2('^ok$'); if (!re.test('ok')) process.exit(1); console.log('re2 native module loaded')"

      - name: 变异测试（${{ matrix.name }}）
        run: npx stryker run --mutate "${{ matrix.mutate }}" --incremental --incrementalFile reports/inc-${{ matrix.name }}.json --concurrency 2
        env:
          PERF_MS: 3000   # 宽松性能阈值（插桩开销）
          # stryker 的 commandRunner 继承本 step 环境，反复 spawn run_unit_tests.js（初始运行 + 每个变异体），
          # 不设此变量时 run_unit_tests.js 会把整张 25 行套件表反复 append 进本 step 的 job summary
          # （GitHub 上限 1MiB/step，实测 1598B/次 → 约 656 次即被截断）。该变量的语义即「已在变异运行内」，
          # 同时被 run_mutation.js 与 test_run_mutation_cli.js 复用。
          XBK_MUTATION_CHILD: '1'

      # 明细报告留档（inc-*.json + mutation.json/html），artifact 有公开下载 API
      - name: 上传变异报告
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mutation-report-${{ matrix.name }}
          path: reports/
          retention-days: 14

  # 汇总各段变异报告 → 发日报 Issue（每日定时自动汇报，手动触发也发）
  report:
    needs: [decide-run, mutation]
    if: always() && needs.decide-run.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    # 发日报 Issue 需要 issues: write（Actions 默认 GITHUB_TOKEN 可能 read-only → 403 失败）
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24

      - name: 下载各段变异报告
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: mutation-reports
          pattern: mutation-report-*
          merge-multiple: false

      - name: 汇总并发日报
        run: node scripts/mutation-report.js mutation-reports --issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
