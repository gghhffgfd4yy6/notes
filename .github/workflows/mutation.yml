name: Mutation

# 变异测试：全量生产代码覆盖。
# 长文件按官方行范围语法（file:start-end）拆分防超时：V3 目前 1 段全覆盖（1-442），sendnotify 拆 2 段。
# ⚠️ v3.270 教训：行段硬编码曾静默漏测尾部新增代码（4495-4924 未变异）。
# 修改大文件后必须同步重拆行段；AGENTS.md「大文件与变异行段」一节有具体步骤，改动前跑
#   node scripts/check-mutation-ranges.js
# 可校验行段是否覆盖文件全量（含文件增长检测）。
# 增量模式：每 job 独立缓存（reports/inc-*.json），首次全量、之后只跑 diff 部分。
# 免费 runner 单任务上限 6h——每段预估 1-2h，余量充足。
# 触发方式：workflow 文件变更 push、手动（Actions → Mutation → Run workflow）和每日自动。
# 主任务避开 UTC 整点：北京时间 00:17 = UTC 16:17；北京时间 12:17 仅在当天无成功或进行中主任务时补跑。
on:
  push:
    paths:
      - '.github/workflows/mutation.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 16 * * *'
    - cron: '17 4 * * *'

# 工作流级兜底最小权限（zizmor excessive-permissions）：4 个 job（decide-run / prepare-re2 / mutation / report）
# 均已显式声明 permissions，job 级整体覆盖工作流级，因此这一层不改变任何 job 的生效权限
# （decide-run 的 actions: read、report 的 issues: write 都来自 job 级）。
# 注意：新增未声明 permissions 的 job 会退回这里（而不是仓库默认的写权限），务必为该 job 显式补权限。
permissions:
  contents: read

# REV-CI：同一 ref 的 Mutation 运行必须串行——本工作流此前完全没有 concurrency，而 test.yml / codeql.yml
# 都有；这是矩阵 job（实测 19 段）互相饿死的实际来源。
# 实测（gh api actions/runs + …/jobs，2026-09-18）：当日 12 次 Mutation 运行里最多 6 次同时 active，
# 其中 5 次落在同一分支 fix/unresolved-114-batch2（01:19 / 01:28 / 02:53 / 03:00 / 03:09 起），
# 每次 19 个 job（matrix.include 实测段数）⇒ 峰值约 114 个 job 争抢并发额度。后果在 job 级排队时间上可见：
# run 35302109509 的 rules / storage / http 三段各自只跑了 1.5 / 1.4 / 1.3 分钟，
# 却分别排队 64.3 / 64.0 / 63.7 分钟（该 run 墙钟 272 分钟，绝大部分是排队不是计算）。
# 按 ref 分组即可完全消除本观测到的重叠形态（重叠的 5 次同 ref），且不影响其它路径：
#   - 主 cron 与分支 dispatch 的 ref 不同 ⇒ 不同组，日报不会被分支任务拖累；
#   - cancel-in-progress: false 是有意为之——Mutation 单段可跑 3.5h（实测 check-deps 215.2min），
#     取消在跑任务等于丢弃已完成的变异进度；这里只要「不重叠」，不要「抢最新」。
#     GitHub 语义下同组内更早的 *pending* 运行会被新运行取代，这正好是我们要的同 ref 去重。
concurrency:
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # GitHub schedule 是尽力调度。中午补偿任务查询同日任意触发方式下成功或未完成的运行，
  # 避免重复执行手动/push 触发的变异测试；主 cron、手动和 push 始终运行。
  decide-run:
    runs-on: ubuntu-latest
    # REV-CI：全仓库此前没有任何 timeout-minutes（grep 命中 0 处），卡死的 job 只能等平台 6h 硬杀，
    # 期间一直占并发额度。各 job 的取值都按下表实测耗时留 ≥3x 余量（gh api …/jobs 的 started→completed）：
    #   decide-run 0.0-0.1min、prepare-re2 0.2-0.3min、report 0.5-0.9min、mutation 见该 job 注释。
    timeout-minutes: 10
    permissions:
      actions: read
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          # 只有中午补偿 cron 需要判定；其他 schedule 新旧主任务均默认执行，避免主 cron 双点维护。
          if [ "$EVENT_NAME" != "schedule" ] || [ "$SCHEDULE" != "17 4 * * *" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TODAY_SH=$(TZ=Asia/Shanghai date +%F)
          START=$(TZ=Asia/Shanghai date -d "$TODAY_SH 00:00:00" +%s)
          END=$((START + 86400))
          # GitHub 返回 UTC createdAt，按上海自然日的 epoch 边界比较，不能直接做日期字符串前缀匹配。
          # 排除当前补偿运行本身；已有成功结果或任意未完成的同日运行时都不补跑，避免重叠或重复。
          RUNS=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow mutation.yml --limit 100 --json databaseId,createdAt,status,conclusion)
          ACTIVE_OR_SUCCESS=$(printf '%s' "$RUNS" | jq --argjson start "$START" --argjson end "$END" --arg current "$CURRENT_RUN_ID" \
            '[.[] | select((.databaseId | tostring) != $current and (.createdAt | fromdateiso8601) >= $start and (.createdAt | fromdateiso8601) < $end and (.conclusion == "success" or .status != "completed"))] | length')
          if [ "$ACTIVE_OR_SUCCESS" -gt 0 ]; then
            echo "当天已有成功或未完成的 Mutation，跳过中午补偿"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "当天没有成功或未完成的 Mutation，执行中午补偿"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  prepare-re2:
    needs: decide-run
    if: needs.decide-run.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15   # 实测 0.2-0.3min；re2 回退源码构建也在数分钟内
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci --ignore-scripts

      # Node 24/Linux x64 的 re2 二进制供全部 mutation 矩阵任务复用；下载失败时自动回退源码构建。
      - name: 安装并验证 re2 原生模块
        run: |
          (cd node_modules/re2 && npm_package_json="$PWD/package.json" node ../install-artifact-from-github/bin/install-from-cache.js --artifact build/Release/re2.node --host-var RE2_DOWNLOAD_MIRROR --skip-path-var RE2_DOWNLOAD_SKIP_PATH --skip-ver-var RE2_DOWNLOAD_SKIP_VER --force-build-var RE2_DOWNLOAD_FORCE_BUILD)
          node -e "const RE2 = require('re2'); const re = new RE2('^ok$'); if (!re.test('ok')) process.exit(1); console.log('re2 native module loaded')"

      - name: 上传 re2 原生模块
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: re2-node24-linux-x64
          path: node_modules/re2/build/Release/re2.node
          if-no-files-found: error
          retention-days: 1

  mutation:
    needs: [decide-run, prepare-re2]
    if: needs.decide-run.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    # REV-CI（PR #156 返工，Qodo Medium / Reliability）：360 分钟 = GitHub 平台的 6 小时硬上限，
    # 这里只是把它**显式化**——它不是、也不能是「留给上传的窗口」。
    # 旧写法 350 的注释声称「留 10 分钟给下方 if: always() 的报告上传」，那是错的：job 级
    # timeout-minutes 会把**同一 job 里后续所有步骤一起杀掉**。Stryker 跑到 350 分钟时，
    # 「剥离 + 上传 + 清理」三步根本没有机会执行 ⇒ 该段 artifact 永久丢失，而汇总 job 的
    # validateSegments 会因缺段硬失败（把一次超时放大成整份日报发不出来）。
    # 正确做法是把时限压在**变异测试那一步**上：step 级超时只杀那一步、job 继续跑，
    # 下方 if: always() 的步骤仍有窗口（见该 step 的 timeout-minutes: 330）。
    # 依据（gh api …/jobs 实测单段 started→completed 的最大值，非排队时间）：
    #   check-deps 215.2min、utils 205.1min、message-store 194.6min、sendnotify-part2 91.7min，
    #   其余 17 段 1.3-81.3min。step 级 330 高于任何实测段耗时 ⇒ 不会新增误杀；
    #   而某步真挂死时，job 级 360（平台硬上限）仍是唯一的上界。
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # V3 入口及拆分模块
          - name: v3-entry
            src: "xbk_function_v3.js"
            mutate: "xbk_function_v3.js:1-442"
          - name: app
            src: "xbk_app.js"
            mutate: "xbk_app.js"
          - name: filter
            src: "xbk_filter.js"
            mutate: "xbk_filter.js"
          - name: formatter
            src: "xbk_formatter.js"
            mutate: "xbk_formatter.js"
          - name: message-store
            src: "xbk_message_store.js"
            mutate: "xbk_message_store.js"
          - name: network
            src: "xbk_network.js"
            mutate: "xbk_network.js"
          - name: pusher
            src: "xbk_pusher.js"
            mutate: "xbk_pusher.js"
          - name: rules
            src: "xbk_rules.js"
            mutate: "xbk_rules.js"
          - name: utils
            src: "xbk_utils.js"
            mutate: "xbk_utils.js"
          # sendnotify（1634 行）拆 2 段
          - name: sendnotify-part1
            src: "xbk_sendNotify_slim.js"
            mutate: "xbk_sendNotify_slim.js:1-750"
          - name: sendnotify-part2
            src: "xbk_sendNotify_slim.js"
            mutate: "xbk_sendNotify_slim.js:751-1634"
          # 小文件各一任务
          - name: failure-policy
            src: "xbk_failure_policy.js"
            mutate: "xbk_failure_policy.js"
          - name: storage
            src: "xbk_storage.js"
            mutate: "xbk_storage.js"
          - name: agents
            src: "xbk_agents.js"
            mutate: "xbk_agents.js"
          - name: http
            src: "xbk_http.js"
            mutate: "xbk_http.js"
          - name: loop
            src: "xbk_loop.js"
            mutate: "xbk_loop.js"
          - name: qinglong-push
            src: "qinglong/xbk_push.js"
            mutate: "qinglong/xbk_push.js"
          - name: check-deps
            src: "scripts/check-deps.js"
            mutate: "scripts/check-deps.js"
          - name: status
            src: "scripts/status.js"
            mutate: "scripts/status.js"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: 恢复增量缓存
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          # 增量缓存 key（PR #156 的「测试指纹强制全量」改动已于 2026-09-19 回退，用户拍板）：
          #   key: stryker-<段>-<src 指纹>；兜底 restore-keys: stryker-<段>-（回到 PR #156 之前的形态）。
          # 为什么回退（旧说法「测试一变就必须全量重跑」不再保留，因为它既不成立也不可负担）：
          #   ① 它**拦不住真根因**：假 Killed 来自**共享缓存的并发串扰**，发生在**变异体运行期**，而基线全程是绿的；
          #      且测试没变时测试指纹不变、主 key 依旧命中 ⇒ 这条改动对真根因完全无效。
          #   ② 它**跑不完**：真正全量下 app(2651) / utils(2402) / message-store(1692) 在 --concurrency 8 下仍需
          #      ~7h / ~6.5h / ~4.5h，必然撞本工作流「变异测试」step 的 330min 超时被杀；而 actions/cache 的
          #      保存是 post-if: success()——**失败段不保存进度** ⇒ 这几段每轮从零开始、**永久红**。
          #   ③ 前提已消失：本 PR 已把 stryker.config.js 的 thresholds.break 改回 null（当前**无分数门禁**）⇒
          #      陈旧增量复用不再能误导任何门禁，「为保护分数门禁而强制全量」这个理由本身就不成立了。
          # 裁剪措辞（有意为之，不是遗漏）：**当前无分数门禁 ⇒ 复用不构成门禁风险；这是有意接受的取舍。**
          #      代价如实写明：被复用的变异体沿用**旧测试状态**下的 killed/survived（不重算），若测试在此期间
          #      变弱，旧基线不会自动失效——这一点在没有分数门禁时只影响日报数字，不影响任何门的红绿。
          # 仍然成立的技术事实（回退不改变它们，勿顺手删）：
          #   * matrix.src 是真实文件名，可直接作 hashFiles 参数；而 mutate 里的范围字面量（如
          #     "xbk_function_v3.js:1-442"）**不能**作 hashFiles 参数——按字面量找不到文件会返回空指纹，
          #     导致 range 段的缓存永不过期，故源指纹一直是 matrix.src 单列。
          #   * coverageAnalysis:'off' 下 incremental-differ 拿不到覆盖信息时**无条件复用**全部旧结果
          #     （killed/survived 原样照搬），这正是「复用」的语义——也是上面那条代价的来源。
          #   * 回退后此前带 -tests- 的旧缓存条目自然不再命中（主 key 变了），属预期行为。
          # 真正的诚实重跑留到下一个 PR：换 TAP runner（实测 34–37×，全量只需几分钟），届时再按诚实基线
          #   重新标定 thresholds.break。在那之前，本条与分数门禁无关。
          path: reports
          key: stryker-${{ matrix.name }}-${{ hashFiles('package-lock.json', 'stryker.config.js', 'run_mutation.js', matrix.src) }}
          restore-keys: |
            stryker-${{ matrix.name }}-

      # F1：缓存（path: reports）会把上一次运行的 reports/mutation/mutation.json 一并恢复，而 stryker 的
      # json 报告不含任何时间戳（内容上无法与本次产出区分）。若本段 stryker 崩溃/被 6h 取消，这个陈旧报告
      # 会被 artifact 原样带上、被日报当成「本次结果」发布。这里先删掉旧报告产物，让「本段没产出报告」表现
      # 为「缺 mutation-report.json」——mutation-report.js 的完整性闸门会直接拒绝发布（不依赖文件时间，
      # 是 mtime 不可靠时的兜底；scripts/mutation-report.js 的 validateFreshness 是另一层）。
      # 只删报告产物目录，保留 reports/inc-<段>.json（--incremental 的断点续跑基线）。
      # 返工（V4 打回）：① 必须紧跟缓存恢复、且在「安装依赖 / 下载+验证 re2」等**可能失败的步骤之前**，
      # 否则那一步失败时清理被跳过；② 必须带 `if: always()`——否则前序步骤失败时本步骤同样被跳过，而
      # 「上传变异报告」是 `if: always()`，回填报告仍会被上传，此时唯一防线就剩 mtime 层（不可靠）。
      # ③ 命令精简为只删 reports/mutation（stryker 默认 jsonReporter=reports/mutation/mutation.json、
      # htmlReporter=reports/mutation/mutation.html，见 mutation-testing-report-schema:754/766；
      # 原来的第二个路径 reports/mutation.html 是死参数）。
      - name: 清理缓存回填的旧报告
        if: always()
        run: rm -rf reports/mutation

      - name: 安装依赖
        run: npm ci --ignore-scripts

      - name: 下载 re2 原生模块
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: re2-node24-linux-x64
          path: node_modules/re2/build/Release

      - name: 验证 re2 原生模块
        run: |
          node -e "const RE2 = require('re2'); const re = new RE2('^ok$'); if (!re.test('ok')) process.exit(1); console.log('re2 native module loaded')"

      # 分数门禁状态（2026-09-19 起）：stryker.config.js 的 thresholds.break = null ⇒ **本步不再因分数置退出码**。
      # 撤回 65 的依据：① 同配置/同 commit/同段（storage，tap 口径）三轮实测 79.08% / 82.92% / 71.02%，
      # 极差 11.90pp（三轮 noCoverage 均 34、coveredBy 均 285/285 ⇒ 抖动来自测试自身而非覆盖面），任何固定
      # 阈值都只会随噪声误红/误绿；②「最低段 69.38%」是**含陈旧增量复用**的虚高值（已证伪），去污染后的真实
      # 全量为 v3-entry 47.81% / storage 59.30%；③ 严格 `<` 遇 NaN（totalValid = 0）时恒为 false ⇒ 分数门禁
      # 自身带假绿通道（详见 stryker.config.js 的 thresholds 注释与**下一步**的 fail-closed 守卫）。
      # 因此本步只跑变异、不做分数判定；「报告本身不可信」（全 RuntimeError / 空报告 / 报告缺失）改由下一步的
      # fail-closed 守卫响亮变红。重新标定 break 的前提（测试抖动治理 + TAP runner 迁移）见 stryker.config.js。
      # 为什么是「先治抖动再标定」而不是现在补一个更低的数：11.9pp 的抖动大于任何可选的阈值余量，
      # 在噪声上再挑一个数只是把误红/误绿换个位置。
      # --concurrency：2 → 8（2026-09-19 实测）。依据（一次性 A/B 实验工作流 exp-concurrency-ab + 同 run CPU 观测）：
      #   * 2→4 = 1.88×、4→8 = 1.84×，即 2→8 共 **3.46×**（http 段实测 72.6min → 21.8min）；
      #   * 4 vCPU **远未饱和**：C=8 时整机仅 ~37% 忙，单条链只吃 ~15% CPU、85% 在等待 ⇒ 提高 C 填的是
      #     测试进程的等待空档（command runner 的开销在进程启动/套件串行，不在算力），不是抢 CPU；
      #   * 同档位 run-to-run 方差 ~6%，故不取更高：8 已把等待吃满，再高收益递减并放大资源争用；
      #   * stryker.config.js 的 concurrency 变量仍保留为本地默认（CLI 覆盖它），本行是 CI 的唯一生效值。
      # 为什么时限加在**这一步**而不是靠 job 级的「留 10 分钟」（PR #156 返工）：job 级超时会把同一 job
      # 后续所有步骤一起杀掉（详见 job 级 timeout-minutes 注释），step 级超时只杀这一步、job 继续跑 ⇒
      # 下方 if: always() 的「守卫 / 剥离 / 上传 / 清理」仍有窗口。330 高于实测最大段耗时
      # （check-deps 215.2min）⇒ 正常段落不会被误杀。
      - name: 变异测试（${{ matrix.name }}）
        timeout-minutes: 330
        run: npx stryker run --mutate "${{ matrix.mutate }}" --incremental --incrementalFile reports/inc-${{ matrix.name }}.json --concurrency 8
        env:
          PERF_MS: 3000   # 宽松性能阈值（插桩开销）
          # stryker 的 commandRunner 继承本 step 环境，反复 spawn run_unit_tests.js（初始运行 + 每个变异体），
          # 不设此变量时 run_unit_tests.js 会把整张套件表反复 append 进本 step 的 job summary
          # （GitHub 上限 1MiB/step，实测 1598B/次 → 约 656 次即被截断）。该变量的语义即「已在变异运行内」，
          # 同时被 run_mutation.js 与 test_run_mutation_cli.js 复用。
          XBK_MUTATION_CHILD: '1'

      # fail-closed 守卫（本轮新增）：分数门禁已撤回（break = null），但「报告本身不可信」必须仍然响亮失败。
      # 它兜住 stryker 不会置退出码的假绿通道（NaN 通道的源码依据见 stryker.config.js 的 thresholds 注释）：
      #   ① 任一变异体 status = RuntimeError —— 测试自身崩溃导致的「没能判定」，既不算已检出也不算存活，
      #      出现即说明本轮测试环境有问题，不能被当成「分数还过得去」；
      #   ② totalValid = killed + timeout + survived + noCoverage = 0（全 RuntimeError / 全 CompileError /
      #      空报告）⇒ stryker 的 mutationScore 为 NaN，而 `NaN < break === false` ⇒ 不置退出码 = job 假绿；
      #   ③ 报告缺失或不可读 —— 守卫失去判定输入，按 fail-closed 拒绝放行。注意这与「worker 未产出报告」的
      #      缺段判据不是同一回事：缺段由汇总 job 的 validateSegments 负责，这里只管「守卫自己判不了」。
      # 判据与读取口径全部复用 scripts/mutation-json.js 的 readReportJson / resolveMaxReportBytes（不另写一份
      # 读取与大小上限逻辑，避免护栏漂移）；状态名取自仓库已安装的 mutation-testing-report-schema 的 MutantStatus enum。
      # 放在 stryker 之后、上传 artifact 之前，且带 if: always()：stryker 失败/超时时也要判一遍；
      # 它红不会吞掉报告留档（「上传变异报告」仍是 if: always()），与「门禁红而日报照发」同一考虑。
      - name: 变异报告 fail-closed 守卫（${{ matrix.name }}）
        if: always()
        run: node scripts/mutation-guard.js --segment "${{ matrix.name }}" reports/mutation/mutation.json

      # F-04（落盘侧，REV-CI）：修掉 statusReason 的「纯废重」膨胀。stryker 的 command runner 把每个
      # 变异体的整段测试输出写进 statusReason，实测占 mutation-report.json 的 99.89%
      # （真实 artifact 实测：103,101,102 → 116,206 字节）；而全仓消费方只在**内存**里剥掉它、从不写回，
      # 于是每份上传 artifact 都白背这份废重。这里在上传**之前**落盘剥离。
      # 范围与理由（PR #156 返工，Qodo Medium / Observability：只剥机器报告，**不再碰 inc**）：
      #   * reports/mutation/mutation.json —— 机器报告；剥离后消费方（readReportJson）读到的对象逐字段不变
      #     （它本来就把该字段置空串），门禁语义零变化；
      #   * reports/inc-*.json —— --incremental 基线，**本轮起明确不剥离**。它是下一次运行
      #     incremental-differ 的**复用输入**：statusReason 会被原样透传进新产出的 JSON/HTML，一旦在这里
      #     置空串，被复用的变异体就永远解释不了自己当初为什么存活/报错——与下方「不动 mutation.html」
      #     完全同一条理由（那是诊断信息，剥掉等于删掉）。代价如实写明：放弃 inc 的体积收益
      #     （实测 103,211,154 → 225,895 字节的那部分），换取「复用变异体的 reason 不会永久变空」。
      #   * 不动 mutation.html —— 那是给人看的明细留档，剥掉它等于删掉「这个变异体为什么存活/报错」这条信息。
      # 为什么 artifact 可以不含 inc（已核实，非推测）：reports/inc-*.json 在 artifact 侧**没有任何消费方**——
      #   scripts/mutation-report.js 的 findReportJson/analyzeSegment 与 .github/analyze-artifacts.js 的
      #   文件名匹配集都只认 mutation.json / mutation-report.json（递归查找这两个名字），report job 的
      #   download-artifact 用的也是 pattern: mutation-report-*；inc 只被本 job 内 stryker
      #   --incrementalFile 按路径直接读，从不经 artifact 流转 ⇒ 上传收窄到 reports/mutation/ 零影响。
      # 为什么在上传之前：artifact 取的就是此刻的磁盘状态（缓存保存是 job 结束后的 post 步骤，也取此刻状态）。
      # 为什么 if: always()：与「清理缓存回填的旧报告」「上传变异报告」同口径；stryker 失败时本步只会看到
      #   「无文件」并显式跳过——它**只重写已存在的文件、从不新建**，因此不会把崩溃段伪装成有报告，
      #   validateSegments 的缺段判据与 validateFreshness 的 mtime 判据都不受影响（剥离只发生在 stryker
      #   刚刚产出的文件上；缓存回填的报告在本 job 顶部已被 rm -rf 清掉）。
      # 注：step 名沿用旧名（左侧仍带「缓存」字样）以免与既有对账断言漂移——剥离对 reports/ 缓存的净影响
      #   本就为零：reports/mutation 会在「清除本次将进入缓存的报告产物」里被整目录 rm -rf，从不进缓存。
      - name: 剥离报告中的 statusReason（artifact/缓存瘦身）
        if: always()
        run: |
          shopt -s nullglob
          targets=()
          for f in reports/mutation/mutation.json; do
            if [ -f "$f" ]; then targets+=("$f"); fi
          done
          if [ ${#targets[@]} -eq 0 ]; then
            echo "ℹ️  无报告产物可剥离（stryker 未产出报告），跳过"
            exit 0
          fi
          node scripts/mutation-report.js --strip "${targets[@]}"

      # 明细报告留档（reports/mutation/ 下的 mutation.json + mutation.html），artifact 有公开下载 API。
      # PR #156 返工：path 由 reports/ 收窄为 reports/mutation/，并补 if-no-files-found: error。
      #   ① 收窄：reports/ 会把**未剥离**的 reports/inc-*.json 一起打包，而 artifact 侧没有任何消费方
      #      （核实结论见上方剥离步骤注释）⇒ 只是白带体积；
      #   ② if-no-files-found: error：stryker 没产出报告（崩溃/被取消）时，原本会静默产出一个只含 inc 的
      #      artifact，把「缺段」拖到汇总 job 才暴露；现在上传自身就响亮变红，故障点前移到段 job。
      # 缓存（path: reports）不受影响：reports/inc-*.json 仍是未剥离的完整增量基线（这就是保诊断信息的代价）。
      # 保留期 v3.276 起由 14 天改为 7 天（用户批准）：跨 run 消费者只有 .github/workflows/analyze-artifacts.yml
      # （按 run-id 下载最近一次「成功」运行的 artifact），该工作流仅由自身变更 push 或手动 dispatch 触发，
      # 故「连续 7 天无成功变异运行」才会让它失去输入；本 run 内的 report job 同 run 下载，不受影响。
      - name: 上传变异报告
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mutation-report-${{ matrix.name }}
          path: reports/mutation/
          if-no-files-found: error
          retention-days: 7

      # REV-CI（落地 stryker.config.js 自述的 F-04）：缓存（path: reports）此前会把
      # reports/mutation/{mutation.json,mutation.html} 一并保存——而这个目录正是本 job 最上方的
      # 「清理缓存回填的旧报告」每次都要 `rm -rf` 掉的东西：保存 → 恢复 → 删除，纯浪费。
      # 量化依据（gh api …/actions/caches，2026-09-18）：
      #   * 仓库缓存共 519 条 / 4860MiB（= 10GiB 配额的 47.5%），其中 stryker-* 481 条占 4234MiB（87%）；
      #   * 分段条目数 24-28 条/段（sendnotify 两段合计 62 条），同一段的近重复条目在持续堆积；
      #   * 同目录 artifact 体积实测 avg 64MiB/段、最大 179MiB（mutation-report-app），
      #     说明 reports/mutation/* 是 reports/ 里的绝对大头（磁盘上无法经 API 拆出 inc-*.json 的占比，
      #     故此处不宣称具体节省量，只断言「本工作流明确删除的目录不再被缓存」这一事实）。
      # 为什么放在「上传变异报告」之后：artifact 仍需要 reports/mutation/（report job 靠它汇总），
      #   而 actions/cache 的保存在**job 全部步骤结束后**的 post 步骤执行 ⇒ 此处删除只影响缓存、不影响 artifact。
      # 为什么 if: always()：与「清理缓存回填的旧报告」「上传变异报告」同一口径——stryker 失败/超时时，
      #   缓存更不应该把半成品报告留下来。
      # 与既有防线的关系：本步只关掉「写侧」，两条既有防线全部保留——
      #   ① 上方的 `rm -rf reports/mutation`（恢复后立即清，带 if: always()）；
      #   ② scripts/mutation-report.js 的 validateFreshness（mtime/运行起点）。
      #   reports/inc-<段>.json（--incremental 的断点续跑基线）**不动**，增量能力不受影响。
      - name: 清除本次将进入缓存的报告产物（保留增量断点）
        if: always()
        run: rm -rf reports/mutation

  # 汇总各段变异报告 → 发日报 Issue（每日定时自动汇报，手动触发也发）
  report:
    needs: [decide-run, mutation]
    if: always() && needs.decide-run.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15   # 实测 0.5-0.9min（下载全部 artifact + 汇总发日报）
    # 发日报 Issue 需要 issues: write（Actions 默认 GITHUB_TOKEN 可能 read-only → 403 失败）
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false   # 不把 GITHUB_TOKEN 写进 .git/config（zizmor artipacked）；发日报走 API，不需要 git 凭据

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24

      - name: 下载各段变异报告
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: mutation-reports
          pattern: mutation-report-*
          merge-multiple: false

      - name: 汇总并发日报
        run: node scripts/mutation-report.js mutation-reports --issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # F1（返工）：本轮运行起点——validateFreshness 的第三层据此拦截「同日跨轮回填」（全体段
          # mtime 互差≈0 且都在 12h 阈值内时，只比较本批最新报告看不见）。matrix job 必然晚于该时刻。
          MUTATION_RUN_STARTED_AT: ${{ github.run_started_at }}
