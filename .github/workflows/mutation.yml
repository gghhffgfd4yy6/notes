name: Mutation

# 变异测试：全量生产代码覆盖。
# 长文件按官方行范围语法（file:start-end）拆分防超时：V3 拆 4 段、sendnotify 拆 2 段。
# 增量模式：每 job 独立缓存（reports/inc-*.json），首次全量、之后只跑 diff 部分。
# 免费 runner 单任务上限 6h——每段预估 1-2h，余量充足。
# 触发方式：手动（Actions → Mutation → Run workflow）+ 每日自动（北京时间 0:00 = UTC 16:00）
on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'

jobs:
  mutation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # V3（3618 行）拆 4 段
          - name: v3-part1
            mutate: "xbk_function_v3.js:1-900"
          - name: v3-part2
            mutate: "xbk_function_v3.js:901-1800"
          - name: v3-part3
            mutate: "xbk_function_v3.js:1801-2700"
          - name: v3-part4
            mutate: "xbk_function_v3.js:2701-3618"
          # sendnotify（1308 行）拆 2 段
          - name: sendnotify-part1
            mutate: "xbk_sendNotify_slim.js:1-654"
          - name: sendnotify-part2
            mutate: "xbk_sendNotify_slim.js:655-1308"
          # 小文件各一任务
          - name: failure-policy
            mutate: "xbk_failure_policy.js"
          - name: storage
            mutate: "xbk_storage.js"
          - name: agents
            mutate: "xbk_agents.js"
          - name: http
            mutate: "xbk_http.js"
          - name: loop
            mutate: "xbk_loop.js"
          - name: qinglong-push
            mutate: "qinglong/xbk_push.js"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: 恢复增量缓存
        uses: actions/cache@v5
        with:
          path: reports
          key: stryker-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            stryker-${{ matrix.name }}-

      - name: 安装依赖
        run: npm ci --ignore-scripts

      - name: 变异测试（${{ matrix.name }}）
        run: npx stryker run --mutate "${{ matrix.mutate }}" --incremental --incrementalFile reports/inc-${{ matrix.name }}.json --concurrency 2
        env:
          PERF_MS: 3000   # 宽松性能阈值（插桩开销）

      # 明细报告留档（inc-*.json + mutation.json/html），artifact 有公开下载 API
      - name: 上传变异报告
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: mutation-report-${{ matrix.name }}
          path: reports/
          retention-days: 14

  # 汇总各段变异报告 → 发日报 Issue（每日定时自动汇报，手动触发也发）
  report:
    needs: mutation
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24

      - name: 下载各段变异报告
        uses: actions/download-artifact@v5
        with:
          path: mutation-reports
          pattern: mutation-report-*
          merge-multiple: false

      - name: 汇总并发日报
        run: node scripts/mutation-report.js mutation-reports --issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: junhanw868-bot/notes
