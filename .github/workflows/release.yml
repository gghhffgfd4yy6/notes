name: Release

# 版本发布自动化：推送 v* tag 时自动校验版本一致性（101 章测试）并创建 GitHub Release
# 触发方式：git tag vX.Y.Z && git push origin vX.Y.Z
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
jobs:
  # 手动触发（workflow_dispatch）但所选 ref 不是 v* tag 时给出明确提示：
  # 否则 release job 被 job 级 if 拦下仅显示 skipped，用户不知道为什么没运行。
  # 仅在 dispatch 且非 v* tag 时运行；push tag 与 dispatch 于 v* tag 时条件为假，不影响正常路径。
  dispatch-hint:
    if: ${{ github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: 明确报错：workflow_dispatch 必须在 v* tag 上运行
        run: |
          echo "::error::release 工作流只应在 v* tag 上运行；当前 ref 是 ${GITHUB_REF}（触发方式：workflow_dispatch）。"
          echo "请在正确的 tag 上重试，例如：git tag v3.272 && git push origin v3.272"
          exit 1

  release:
    # 仅在 v* tag 触发时运行：workflow_dispatch 在分支上触发时 GITHUB_REF 为 refs/heads/*，
    # 会使 VERSION 提取得到错误值并创建错误 tag/Release，故用 job 级条件拦住非 tag 运行。
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # 校验 tag 版本号格式（semver）：job 级 if 只保证 v* 前缀，vfoo 这类非版本 tag 也会被放行，
      # 必须在创建 Release 前显式失败并 exit 1，避免误建 Release。
      # 仓库版本格式：CHANGELOG 为 v3.272（两段）、package.json 为 3.272.0（三段），两种形式均接受；
      # 数字组件不允许前导零（03.2 非法，0.1.0 合法），后缀（prerelease/build）不允许空组件/以 . 结尾
      # （alpha.、alpha..1 非法，rc.1、build.5 合法）；正则无嵌套/相邻量词，线性安全（参考 #127 超线性正则教训）。
      - name: 校验 tag 版本号格式（semver）
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*))?([-][0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?([+][0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::tag 名称 'v${VERSION}' 不是合法版本号（应为 v数字.数字[.数字][-后缀] 形式，如 v3.272 / v3.272.0），已中止 Release 创建。"
            exit 1
          fi
          echo "版本号格式校验通过：v${VERSION}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: npm

      # D2：上面的「校验 tag 版本号格式」只保证 tag 长得像版本号，不保证它是仓库当前版本——
      # `git tag v3.273 && git push`（而 package.json 是 3.272.0）旧流程能整条走通并建出 Release。
      # 这里补 tag ↔ package.json 一致性断言（fail-loud）：按仓库既有口径取「两段」版本比较
      # （check-version.js 把 package.json 的 3.272.0 归一为 3.272、CHANGELOG 标题为 ## v3.272，
      # 故两段是三方共同口径）；三段式 tag（v3.272.0）归一后同为 3.272，仍然合法。
      # 补丁段非 0 的 tag（如 v3.272.1）显式拒绝：它与 3.272.0 归一后同基线、闸门无法区分，
      # 放行会建出标题为 v3.272.1 而 package.json 仍是 3.272.0 的 Release（#136 sourcery/qodo）。
      # 注意：不能用 check-version.js 的 /\.\d+$/ 直接归一 tag——两段输入 3.272 会被削成 3，
      # 故此处显式取前两个数字组件。放在 npm ci 之前，版本漂移可秒级失败、不浪费依赖安装时间。
      - name: 校验 tag 与 package.json 版本一致（tag 漂移闸门）
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          node -e "
            const pkg = require('./package.json')
            const norm = v => String(v).split(/[-+]/)[0].split('.').slice(0, 2).join('.')
            const raw = String(process.argv[1]).split(/[-+]/)[0]
            const tagBase = norm(process.argv[1])
            const pkgBase = norm(pkg.version)
            if (raw !== tagBase && raw !== tagBase + '.0') {
              console.error('::error::tag v' + process.argv[1] + ' 的补丁段非 0（仓库口径为两段式，应打 v' + tagBase + ' 或 v' + tagBase + '.0），已中止 Release 创建。')
              process.exit(1)
            }
            if (tagBase !== pkgBase) {
              console.error('::error::tag v' + process.argv[1] + ' 与 package.json 版本 ' + pkg.version + ' 不一致（归一后 ' + tagBase + ' ≠ ' + pkgBase + '），已中止 Release 创建。')
              process.exit(1)
            }
            console.log('tag 与 package.json 版本一致：v' + pkgBase)
          " "$VERSION"

      - name: 安装依赖
        run: npm ci --ignore-scripts

      # 仅执行 re2 自身安装脚本，优先使用带 SHA-256 校验的预编译包，失败时由其脚本回退 node-gyp 源码构建。
      - name: 安装并验证 re2 原生模块
        run: |
          (cd node_modules/re2 && npm_package_json="$PWD/package.json" node ../install-artifact-from-github/bin/install-from-cache.js --artifact build/Release/re2.node --host-var RE2_DOWNLOAD_MIRROR --skip-path-var RE2_DOWNLOAD_SKIP_PATH --skip-ver-var RE2_DOWNLOAD_SKIP_VER --force-build-var RE2_DOWNLOAD_FORCE_BUILD)
          node -e "const RE2 = require('re2'); const re = new RE2('^ok$'); if (!re.test('ok')) process.exit(1); console.log('re2 native module loaded')"

      - name: 版本一致性校验（101 章：文件头 ↔ CHANGELOG ↔ package.json）
        run: npm run check

      # D2：notes 也按「归一后的两段版本」查找 CHANGELOG 标题（仓库约定 ## v3.272），
      # 使三段式 tag（v3.272.0）不再因 CHANGELOG 标题是两段而失配；未命中时 fail-loud，
      # 不再像旧实现那样静默退化为字面量 notes（Release 正文只剩一行 "v3.272.0" 而无人察觉）。
      # 标题匹配再加「后一字符不是数字」的边界，避免 base=3.27 前缀误配 ## v3.270 拿到错误章节
      # （#136 sourcery；用 [^0-9] 而非空白类，既不引入多层转义、也顺带挡住 ## v3.2721）。
      - name: 提取 Release Notes（从 CHANGELOG 对应版本段）
        id: notes
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          node -e "
            const fs = require('fs')
            const c = fs.readFileSync('CHANGELOG.md', 'utf8')
            const base = String(process.argv[1]).split(/[-+]/)[0].split('.').slice(0, 2).join('.')
            const esc = base.replace(/[.*+?^\${}()|[\]\\\\]/g, '\\\\$&')
            const m = c.match(new RegExp('## v' + esc + '(?=[^0-9]|$)' + '[\\\\s\\\\S]*?(?=\\n## v|$)', 'm'))
            if (!m) {
              console.error('::error::CHANGELOG 中未找到 ## v' + base + ' 章节（tag v' + process.argv[1] + '），无法生成 Release Notes，已中止 Release 创建。')
              process.exit(1)
            }
            fs.writeFileSync('release-notes.md', m[0].trim())
          " "$VERSION"

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          gh release create "v$VERSION" --title "v$VERSION" --notes-file release-notes.md
