name: Stale

# 清理长期无活动的 Issue/PR
# 供应链安全：固定 commit SHA
on:
  push:
    paths:
      - '.github/workflows/stale.yml'
  schedule:
    - cron: '0 3 * * *'   # 每天 03:00 UTC
  workflow_dispatch:

# 工作流级兜底最小权限（zizmor excessive-permissions）：唯一的 stale job 已显式声明 issues/pull-requests: write，
# job 级整体覆盖工作流级，因此这一层不改变生效权限（actions/stale 仍按 job 级拿写权限，无需 contents）。
# 注意：新增未声明 permissions 的 job 会退回这里（而不是仓库默认的写权限），务必为该 job 显式补权限。
permissions:
  contents: read

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93  # v11.0.0
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 60
          days-before-pr-close: 14
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          exempt-issue-labels: 'pinned,security'
          exempt-pr-labels: 'pinned,security,dependabot'   # Dependabot 升级 PR 不清理
          operations-per-run: 100
