name: analyze-artifacts
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/analyze-artifacts.yml'
  workflow_dispatch:
    inputs:
      run_id:
        description: 'mutation workflow run ID（留空 = 自动取最新成功运行）'
        required: false
        type: string

# 工作流级兜底最小权限（zizmor excessive-permissions）：唯一的 analyze job 已显式声明 contents/actions: read，
# job 级整体覆盖工作流级，因此这一层不改变生效权限（跨 run 下载 artifact 仍靠 job 级 actions: read）。
# 注意：新增未声明 permissions 的 job 会退回这里（而不是仓库默认的写权限），务必为该 job 显式补权限。
permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    # REV-CI：本工作流此前无 timeout-minutes。该 job 要把 19 个段（实测 avg 64MiB、最大 179MiB，
    # 合计 ~1.3GiB）全量下载后再解析，20min 覆盖下载+解析且远低于平台 6h 默认。
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: 获取 mutation run ID
        id: mutation-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID_INPUT: ${{ github.event.inputs.run_id }}
        run: |
          # 经 env 传参防 $GITHUB_OUTPUT 注入；run_id 严格校验纯数字
          if [ -n "$RUN_ID_INPUT" ]; then
            case "$RUN_ID_INPUT" in
              *[!0-9]*) echo "::error::run_id 必须为纯数字"; exit 1 ;;
            esac
            echo "run_id=$RUN_ID_INPUT" >> "$GITHUB_OUTPUT"
          else
            # 默认只选「真跑过变异」的成功运行：schedule 触发的 run 若 decide-run 判 skip，
            # prepare-re2 / mutation / report 三个 job 全部 skipped，run 结论仍是 success 但零 artifact
            # ——`--limit=1` 会正好选中这种空运行（C10-014，实例 run 40483388111），下载 pattern 零命中
            # 不报错，随后 analyze-artifacts.js 报「未找到任何报告」并 exit 1：误红，且文案让人以为
            # 「最新成功 run 没有报告」。判据直接用产物本身：该 run 至少有一个 mutation-report-* artifact。
            # 显式 run_id 不受此限制（允许分析任意 run，包括尚未 upload 完的）。
            run_id=""
            mapfile -t candidates < <(gh run list --workflow=mutation.yml --status=success --limit=20 --json databaseId --jq '.[].databaseId')
            for candidate in "${candidates[@]}"; do
              if gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$candidate/artifacts?per_page=100" \
                   --jq '.artifacts[].name' | grep -q '^mutation-report-'; then
                run_id="$candidate"
                break
              fi
            done
            if [ -z "$run_id" ]; then
              echo "::error::最近 20 次成功的 mutation 运行中没有任何带 mutation-report-* 产物的运行；请显式传入 run_id"
              exit 1
            fi
            echo "选中 run_id=$run_id（该 run 存在 mutation-report-* 产物）"
            echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          fi
      - name: 下载全部变异报告
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: reports-all
          pattern: mutation-report-*
          # v3.262：merge-multiple 会把各 job 同名的 mutation.json 互相覆盖，分析只统计到
          # 最后一个 job；改 false 保留目录结构（analyze-artifacts.js 递归遍历），统计完整。
          merge-multiple: false
          run-id: ${{ steps.mutation-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: 解析存活变异体分布
        run: node .github/analyze-artifacts.js
