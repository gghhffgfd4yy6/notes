name: Test

# 每次 push / PR 自动执行三套测试，全部 PASS 才可合并/发布
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [16, 18, 20]   # 兼容测试（engines 声明 >=14）
    steps:
      # 供应链安全：固定完整 commit SHA（可变 tag 可被上游重新指向，静默注入攻击代码）
      # 升级时由 Dependabot/手动替换为新 SHA
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: 安装 HTTP 依赖（官方 got）
        run: npm install --ignore-scripts

      - name: 单元测试（test_filter.js）
        run: npm run test:filter

      - name: 通道测试（test_notify.js）
        run: npm run test:notify

      - name: 集成测试（test_app.js，含真实重试等待）
        run: npm run test:app:serial
