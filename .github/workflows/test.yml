name: Test

# 质量门禁：push / PR 自动执行。任何一步失败 → 阻断合并。
# 流水线：lint → 版本一致性 → 单元 → 通道 → 集成(并行) → 集成(串行完整) → 安全审计
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * *"   # 每日冒烟，防环境漂移
  push:
    branches: [main]

permissions:
  contents: read

# 同一事件类型下的 PR/分支有新提交时，旧提交的完整矩阵已无参考价值；取消它以释放 runner，
# 只保留最新提交的质量结果。push、PR 与每日定时任务按事件类型隔离，不会互相取消。
concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.22.2, 24]   # re2@1.26.1 要求 Node >=22.22.2
    steps:
      # 供应链安全：固定完整 commit SHA（可变 tag 可被上游重新指向，静默注入攻击代码）
      # 升级时由 Dependabot/手动替换为新 SHA
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: 安装依赖（忽略脚本，防供应链风险）
        run: npm ci --ignore-scripts

      # re2 是可选原生依赖；仅执行 re2 自身安装脚本，优先使用带 SHA-256 校验的预编译包，失败时由其脚本回退 node-gyp 源码构建。
      - name: 安装并验证 re2 原生模块
        run: |
          (cd node_modules/re2 && npm_package_json="$PWD/package.json" node ../install-artifact-from-github/bin/install-from-cache.js --artifact build/Release/re2.node --host-var RE2_DOWNLOAD_MIRROR --skip-path-var RE2_DOWNLOAD_SKIP_PATH --skip-ver-var RE2_DOWNLOAD_SKIP_VER --force-build-var RE2_DOWNLOAD_FORCE_BUILD)
          node -e "const RE2 = require('re2'); const re = new RE2('^ok$'); if (!re.test('ok')) process.exit(1); console.log('re2 native module loaded')"

      - name: Lint（standard）
        run: npm run lint

      - name: 版本一致性闸门（文件头 ↔ CHANGELOG ↔ package.json）
        run: node check-version.js

      - name: 单元测试（test_filter.js，含 101 章版本校验）
        run: npm run test:filter

      - name: mutation-json 回归（超大报告解析）
        run: npm run test:mutation-json

      - name: 变异报告渲染回归（v3.266 render 快照，防重构漂移）
        run: npm run test:mutation-report

      - name: 变异矩阵覆盖校验
        run: npm run test:mutation-ranges

      - name: 通道测试（test_notify.js）
        run: npm run test:notify

      # v3.262：常驻相关回归此前只在 run_tests.js/npm test 里跑，CI 门禁完全未覆盖，
      # 改动 xbk_loop/xbk_push/xbk_agents 可带回归通过 PR。补齐 5 个套件。
      - name: 常驻循环测试（test_loop.js）
        run: npm run test:loop

      - name: 常驻失败策略测试（test_failure_policy.js）
        run: npm run test:failure-policy

      - name: DNS 失效回归（test_dns_cache.js）
        run: npm run test:dns

      - name: TLS 预热回归（test_tls_prewarm.js）
        run: npm run test:tls-prewarm

      - name: 延迟加载回归（test_lazy_notify.js）
        run: npm run test:lazy

      - name: 循环工具函数测试（test_loop_utils.js）
        run: npm run test:loop-utils

      - name: 安全文件存储测试（test_storage.js）
        run: npm run test:storage

      - name: Agent辅助函数测试（test_agents.js）
        run: npm run test:agents

      - name: 网络重试测试（test_network.js）
        run: npm run test:network

      - name: HTTP封装测试（test_http.js）
        run: npm run test:http

      - name: 推送工具函数测试（test_sendnotify_utils.js）
        run: npm run test:sendnotify-utils

      - name: 青龙工具函数测试（test_qinglong_utils.js）
        run: npm run test:qinglong-utils

      # integration 套件虽然被 run_unit_tests.js 跳过（因标记为慢/可能有网络），
      # 但它们本身可独立通过，必须显式接入 CI 门禁，
      # 否则改动 xbk_push/xbk_agents/scripts/status 可带回归通过 PR。
      # 说明：多数套件已 mock 化、不依赖真实网络；test_qinglong_runcheck.js 的“全部通过”用例
      # 已用 withHealthyEnv mock 隔离 Node/got/re2 探测；个别套件仍可能受运行环境影响
      # （runCheck 会校验 Node≥22/got/re2，GitHub 侧由本工作流前面的 re2 安装步骤保证）。
      - name: 青龙命令行测试（test_cli.js）
        run: npm run test:cli

      - name: 青龙常驻测试（test_qinglong_resident.js）
        run: npm run test:qinglong-resident

      - name: 青龙诊断测试（test_qinglong_runcheck.js）
        run: npm run test:qinglong-runcheck

      - name: 状态面板测试（test_status.js）
        run: npm run test:status

      # mutationSkip 套件：被 run_unit_tests.js 跳过，必须在 CI 显式覆盖。
      # 仅因 Stryker 沙箱插桩会行数膨胀跑不了而标记 mutationSkip，CI 可正常独立运行。
      - name: 变异范围校验测试（test_check_mutation_ranges.js）
        run: npm run test:check-mutation-ranges

      # 命名区分：test:mutation-ranges 跑生产脚本 scripts/check-mutation-ranges.js；
      # test:mutation-ranges-unit 跑对它的单元测试 test_mutation_ranges.js。
      - name: 变异范围测试（test_mutation_ranges.js）
        run: npm run test:mutation-ranges-unit

      # 全量单元测试门禁：跑 run_unit_tests.js（26个单元测试套件，已排除 integration/mutationSkip），
      # 确保新增测试文件不会因未单独列出而漏网（#100/#101 曾因此红测合入）。
      # 与工作流中逐个列出的显式步骤互补：显式步骤用于失败时快速定位具体套件，
      # 本步骤用于兜底防漏网，因此部分非集成套件会执行两次——这是有意的时间换可定位性，非疏漏。
      # （标记 integration/mutationSkip 的套件不在本入口内，已在本工作流的其他步骤中显式覆盖。）
      - name: 全量单元测试（run_unit_tests.js）
        run: npm run test:unit
        env:
          # 显式步骤已单独跑过这些套件（11 个，含最大的 test_filter.js），全量兜底时跳过避免重复。
          # 失败仍由显式步骤独立呈现（step 名定位）；变异评估子进程不继承本变量（run_mutation.js spawn 强制清空），
          # SKIP 清单须与上方显式步骤保持一致——漏写会重复跑（浪费），多写会漏跑（门禁盲区）；
          # 该双向对账由 test_ci_skip_suites.js 固定在门禁里（含「拼错即失败」）。
          SKIP_SUITES: test_filter.js,test_mutation_json.js,test_mutation_report.js,test_failure_policy.js,test_loop_utils.js,test_storage.js,test_agents.js,test_network.js,test_http.js,test_sendnotify_utils.js,test_qinglong_utils.js

      # 集成测试策略：先跑并行调度版，成功则跳过串行完整版（省时间）；
      # 并行失败时不立即判定失败，再跑串行完整版兜底（并行可能因调度/flaky 失败）。
      # 兜底成功则整体通过，兜底失败才判定集成测试失败。
      - name: 集成测试（并行调度）
        id: integration-parallel
        continue-on-error: true
        run: npm run test:app

      - name: 集成测试（串行完整版，仅并行失败时兜底运行）
        id: integration-serial
        if: steps.integration-parallel.outcome == 'failure'
        run: npm run test:app:serial

      - name: 集成测试结果判定
        # 仅在集成测试真正执行过（未被跳过）且 job 未被取消时才判定；
        # 避免前面步骤失败或 job 被取消时输出误导性的"集成测试失败"。
        if: ${{ !cancelled() && steps.integration-parallel.outcome != 'skipped' && steps.integration-parallel.outcome != '' }}
        run: |
          PARALLEL="${{ steps.integration-parallel.outcome }}"
          SERIAL="${{ steps.integration-serial.outcome }}"
          echo "并行调度结果: $PARALLEL"
          echo "串行完整结果: $SERIAL"
          if [ "$PARALLEL" = "success" ]; then
            echo "✅ 并行集成测试通过，跳过串行完整版"
          elif [ "$SERIAL" = "success" ]; then
            echo "⚠️ 并行失败，串行兜底通过（并行可能为 flaky，建议关注）"
            # 兜底通过不阻断本次 CI，但必须以注解显形，避免 flaky 长期藏在日志里
            echo "::warning title=集成测试走了串行兜底::并行调度失败但串行完整版通过，本次不判定失败；若反复出现请排查并行调度 flaky。"
          else
            echo "❌ 集成测试失败：并行${PARALLEL}，串行${SERIAL}"
            exit 1
          fi

      - name: 安全审计（高危及以上）
        run: npm audit --audit-level=high --omit=dev

  # 稳定合并门禁：汇总 quality matrix 结果。
  # 背景：quality 的 check 名带 matrix 版本后缀（quality (22.22.2) 等），若未来增删 Node 版本
  # 或改 job 名，branch protection 绑定的 check 名会失配 → 永久阻塞合并。
  # 方案：加无后缀的汇总 job，Required Checks 只绑定 quality-gate。
  quality-gate:
    runs-on: ubuntu-latest
    needs: quality
    if: always()   # quality 失败也要执行，以产出正确的失败结论
    steps:
      - name: 汇总 quality matrix 结果
        run: |
          RESULT="${{ needs.quality.result }}"
          echo "quality matrix result = ${RESULT}"
          if [ "$RESULT" != "success" ]; then
            echo "❌ quality matrix 存在失败，合并门禁未通过"
            exit 1
          fi
          echo "✅ quality matrix 全部通过"

  # 覆盖率报告：仅在 main 分支运行（PR 不跑，节省 CI 资源）。
  # 合并到 main 后自动跑全量 c8 覆盖率，上传 artifact 供下载查看。
  coverage:
    runs-on: ubuntu-latest
    needs: quality-gate
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖（忽略脚本，防供应链风险）
        run: npm ci --ignore-scripts

      - name: 安装并验证 re2 原生模块
        run: |
          (cd node_modules/re2 && npm_package_json="$PWD/package.json" node ../install-artifact-from-github/bin/install-from-cache.js --artifact build/Release/re2.node --host-var RE2_DOWNLOAD_MIRROR --skip-path-var RE2_DOWNLOAD_SKIP_PATH --skip-ver-var RE2_DOWNLOAD_SKIP_VER --force-build-var RE2_DOWNLOAD_FORCE_BUILD)
          node -e "const RE2 = require('re2'); const re = new RE2('^ok$'); if (!re.test('ok')) process.exit(1); console.log('re2 native module loaded')"

      - name: 全量覆盖率（c8）
        run: npm run test:coverage

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
