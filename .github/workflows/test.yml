name: Test

# 质量门禁：push / PR 自动执行。任何一步失败 → 阻断合并。
# 流水线：lint → 版本一致性 → 单元 → 通道 → 集成(并行) → 集成(串行完整) → 安全审计
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * *"   # 每日冒烟，防环境漂移
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]   # 兼容测试（node 18 已于 2025-04 EOL，矩阵 20/22/24）
    steps:
      # 供应链安全：固定完整 commit SHA（可变 tag 可被上游重新指向，静默注入攻击代码）
      # 升级时由 Dependabot/手动替换为新 SHA
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: 安装依赖（忽略脚本，防供应链风险）
        run: npm ci --ignore-scripts

      # re2 是可选原生依赖；忽略安装脚本后必须显式构建，否则用户正则会全部被安全闸门跳过。
      - name: 构建 re2 原生模块
        run: |
          RE2_DOWNLOAD_FORCE_BUILD=1 npm rebuild re2
          node -e "const RE2 = require('re2'); const re = new RE2('^ok$'); if (!re.test('ok')) process.exit(1); console.log('re2 native module loaded')"

      - name: Lint（standard）
        run: npm run lint

      - name: 版本一致性闸门（文件头 ↔ CHANGELOG ↔ package.json）
        run: node check-version.js

      - name: 单元测试（test_filter.js，含 101 章版本校验）
        run: npm run test:filter

      - name: mutation-json 回归（超大报告解析）
        run: npm run test:mutation-json

      - name: 变异报告渲染回归（v3.266 render 快照，防重构漂移）
        run: npm run test:mutation-report

      - name: 通道测试（test_notify.js）
        run: npm run test:notify

      # v3.262：常驻相关回归此前只在 run_tests.js/npm test 里跑，CI 门禁完全未覆盖，
      # 改动 xbk_loop/xbk_push/xbk_agents 可带回归通过 PR。补齐 5 个套件。
      - name: 常驻循环测试（test_loop.js）
        run: npm run test:loop

      - name: 常驻失败策略测试（test_failure_policy.js）
        run: npm run test:failure-policy

      - name: DNS 失效回归（test_dns_cache.js）
        run: npm run test:dns

      - name: TLS 预热回归（test_tls_prewarm.js）
        run: npm run test:tls-prewarm

      - name: 延迟加载回归（test_lazy_notify.js）
        run: npm run test:lazy

      - name: 集成测试（test_app_p.js，并行调度）
        run: npm run test:app

      - name: 集成测试（test_app.js 串行完整版，绝对验证）
        run: npm run test:app:serial

      - name: 安全审计（高危及以上）
        run: npm audit --audit-level=high --omit=dev

  # 稳定合并门禁：汇总 quality matrix 结果。
  # 背景：quality 的 check 名带 matrix 版本后缀（quality (20) 等），若未来增删 Node 版本
  # 或改 job 名，branch protection 绑定的 check 名会失配 → 永久阻塞合并。
  # 方案：加无后缀的汇总 job，Required Checks 只绑定 quality-gate。
  quality-gate:
    runs-on: ubuntu-latest
    needs: quality
    if: always()   # quality 失败也要执行，以产出正确的失败结论
    steps:
      - name: 汇总 quality matrix 结果
        run: |
          RESULT="${{ needs.quality.result }}"
          echo "quality matrix result = ${RESULT}"
          if [ "$RESULT" != "success" ]; then
            echo "❌ quality matrix 存在失败，合并门禁未通过"
            exit 1
          fi
          echo "✅ quality matrix 全部通过"
