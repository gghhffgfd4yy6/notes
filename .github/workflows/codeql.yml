name: CodeQL

# 安全扫描
# 供应链安全：固定 commit SHA（可变 tag 可被上游重新指向）
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 12 * * 1'   # 每周一 12:00 UTC 定期扫描

# 同一事件类型下新提交到达时取消旧提交的扫描；定时扫描独立分组，不影响安全巡检。
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # CodeQL 上传扫描结果必需
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4.37.8
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality   # 默认安全查询 + 质量查询（更严）
          config-file: .github/codeql/codeql-config.yml   # 排除测试/工具文件

      - name: Autobuild
        uses: github/codeql-action/autobuild@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4.37.8

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4.37.8
