name: CodeQL

# 安全扫描（质量门禁最后一道，依据 .ai/skills/ci-cd-and-automation/）
# 供应链安全：固定 commit SHA（可变 tag 可被上游重新指向）
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 12 * * 1'   # 每周一 12:00 UTC 定期扫描

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # CodeQL 上传扫描结果必需
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@c3400c2f38909e0dcf3c3a41f2030a8217be5d3e  # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality   # 默认安全查询 + 质量查询（更严）

      - name: Autobuild
        uses: github/codeql-action/autobuild@c3400c2f38909e0dcf3c3a41f2030a8217be5d3e  # v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@c3400c2f38909e0dcf3c3a41f2030a8217be5d3e  # v3
