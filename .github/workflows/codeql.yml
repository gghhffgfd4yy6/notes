name: CodeQL

# 安全扫描
# 供应链安全：固定 commit SHA（可变 tag 可被上游重新指向）
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 12 * * 1'   # 每周一 12:00 UTC 定期扫描

# 同一事件类型下新提交到达时取消旧提交的扫描；定时扫描独立分组，不影响安全巡检。
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# 工作流级兜底最小权限（zizmor excessive-permissions）：GitHub 语义是 job 级 permissions 整体覆盖工作流级，
# 本文件唯一的 analyze job 已显式声明（含 security-events: write），因此这一层不改变任何 job 的生效权限。
# 注意：新增未声明 permissions 的 job 会退回这里（而不是仓库默认的写权限），务必为该 job 显式补权限。
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    # REV-CI：本工作流此前无 timeout-minutes。依据（gh api …/workflows/codeql.yml/runs）：
    # 近期 run 墙钟 1.1-4.6min（如 35345072256 = 1.5min，35299124026 = 4.6min），30min 留 ≈6x 余量。
    timeout-minutes: 30
    permissions:
      security-events: write   # CodeQL 上传扫描结果必需
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false   # 不把 GITHUB_TOKEN 写进 .git/config（zizmor artipacked）；本 job 不需要 git 凭据

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality   # 默认安全查询 + 质量查询（更严）
          config-file: .github/codeql/codeql-config.yml   # 排除测试/工具文件

      - name: Autobuild
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
