# Dependabot：依赖安全与更新检查（GitHub 免费）
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # got 12+ 是纯 ESM 包，项目为 CommonJS（require）不兼容（got 14 实测 CI 失败），不可升级
    ignore:
      - dependency-name: got
        versions: [">=12.0.0"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - ci
