# Dependabot：依赖安全与更新检查（GitHub 免费）
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # got 15+ 是纯 ESM 包，项目为 CommonJS（require）不兼容，已评估为不可升级（2026-08-12）
    ignore:
      - dependency-name: got
        versions: [">=15.0.0"]
    # 分组更新：同类升级合并成一个 PR，减少 PR 噪音
    groups:
      npm-production:
        dependency-type: production
      npm-development:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - ci
    groups:
      actions:
        patterns: ["*"]
