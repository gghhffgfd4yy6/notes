---
# check-mutation-ranges.js 是本地/CI 行段覆盖校验脚本：
# 按 mutation.yml 内容动态读仓库内文件是其本职工作，且已做
# path.resolve + 仓库根前缀校验（运行时防护），静态路径告警属误报。
# 详细说明见 PR #34 及脚本头部注释。
#
# test_storage.js 是安全文件存储模块的单元测试：
# 大量 path.join(tmpDir, hardcodedName) 用于在 mkdtempSync 生成的
# 临时目录下构造测试文件路径，目录和文件名均为测试硬编码常量，
# 无任何用户输入，静态路径注入告警属误报。
exclude_paths:
  - "scripts/check-mutation-ranges.js"
  - "test_storage.js"
