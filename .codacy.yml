---
# check-mutation-ranges.js 是本地/CI 行段覆盖校验脚本：
# 按 mutation.yml 内容动态读仓库内文件是其本职工作，且已做
# path.resolve + 仓库根前缀校验（运行时防护），静态路径告警属误报。
# 详细说明见 PR #34 及脚本头部注释。
#
# test_storage.js 是安全文件存储模块的单元测试：
# 大量 path.join(tmpDir, hardcodedName) 用于在 mkdtempSync 生成的
# 临时目录下构造测试文件路径，目录和文件名均为测试硬编码常量，
# 无任何用户输入，静态路径注入告警属误报。
#
# test_check_mutation_ranges.js 是变异范围校验脚本的单元测试：
# 通过子进程 + MUTATION_WORKFLOW_TEXT 环境变量注入 yml 文本，
# buildYml() 构造的 yml 内容和文件路径均为测试硬编码，无用户输入，
# 静态路径注入告警属误报。
#
# test_mutation_report.js 扩展后新增 findReportJson/analyzeSegment 临时目录测试：
# path.join(mkdtemp, 硬编码子目录名) + fs.mkdirSync/writeFileSync 用于构造
# 测试用 mutation.json，目录和文件名均为测试硬编码常量，无用户输入，
# 静态路径注入告警属误报。
#
# test_run_mutation_internal.js 是 run_mutation 内部函数的单元测试：
# 大量 path.join(mkdtempSync, 硬编码文件名) 用于在临时目录下构造测试文件，
# 目录和文件名均为测试硬编码常量，无用户输入，静态路径注入告警属误报。
#
# test_status_report.js 是 scripts/status.js 的单元测试：
# path.join(os.tmpdir(), 硬编码前缀) + fs.mkdtempSync/writeFileSync/rmSync 用于
# 构造临时测试目录和 run.log，目录前缀和文件名均为测试硬编码常量，无用户输入，
# 静态路径注入告警属误报。
#
# test_utils.js 是 xbk_utils.js 的单元测试：
# safeRe mock 使用 new RegExp(src, flags) 构造测试用正则，src/flags 均为测试硬编码
# 常量，无用户输入，ReDoS 告警属误报（生产代码使用 re2 防护）。
#
# test_mutation_report_cli.js 是 scripts/mutation-report.js 的 CLI 集成测试：
# path.join(os.tmpdir(), 硬编码前缀) + fs.mkdtempSync/mkdirSync/writeFileSync/rmSync 用于
# 构造临时测试目录和 mutation.json，目录前缀和文件名均为测试硬编码常量，无用户输入，
# 静态路径注入告警属误报。
#
# test_run_mutation_cli.js 是 run_mutation.js 的运行时单元测试：
# path.join(os.tmpdir(), 硬编码前缀) + fs.mkdtempSync/writeFileSync/rmSync 用于
# 构造临时测试目录和 test_filter.js，目录前缀和文件名均为测试硬编码常量，无用户输入，
# 静态路径注入告警属误报。
#
# run_mutation.js 是变异测试调度器（仅本地/CI 工具，不进入生产运行时）：
# copyProject 中 path.join(ROOT, name) 的 name 来自 fs.readdirSync(ROOT) 按固定正则
# 过滤的 *.js 文件名与硬编码目录名（scripts/qinglong），ROOT 为 __dirname 常量，
# 无任何用户输入参与路径构造，动态路径注入告警属误报。
#
# test_suite_registry.js 是「根目录 test_*.js 必须注册进 test_suites.js」的元门禁（C5）：
# ROOT = path.resolve(__dirname) 为常量；path.join(ROOT, f) 的 f 只来自 test_suites.js 的静态
# SUITES 清单，fs.readdirSync(ROOT) 的结果仅用于与清单对账、不参与路径构造；无任何用户输入，
# 静态路径注入告警属误报。
#
# test_tag_validator.js 的 release.yml 步骤级回归：用 fs.mkdtempSync(os.tmpdir() + 固定前缀)
# 建临时目录，写入测试硬编码的 package.json / CHANGELOG.md 夹具，执行 run: 块后读取产出的
# release-notes.md；目录前缀、夹具文件名与内容全部是测试硬编码常量，无任何用户输入参与路径
# 构造，静态路径注入告警属误报。
#
# .github/analyze-artifacts.js 是变异制品分析工具（仅 CI 运行，不进入生产运行时）：
# walk() 用 fs.readdirSync(dir, { withFileTypes: true }) 的结果拼 path.join(dir, e.name)，
# reportsRoot 由 path.resolve(__dirname, '..') 常量与「本地夹具核对」用的一次性 CLI 参数决定，
# 无外部净输入参与路径构造，动态路径注入告警属误报。
#
# scripts/install-hooks.js 是 git hooks 安装/自检工具（仓库开发者脚本）：
# fs.statSync / fs.existsSync / fs.chmodSync 的目标只由 HOOKS_DIR 常量（'.githooks'）与静态
# HOOK_FILES 清单拼成，无外部净输入，动态路径注入告警属误报（SonarCloud 侧同类误报 S4036
# 已由 .sonarcloud.properties 的 e1 条目登记）。
#
# test_ci_skip_suites.js 的 makeRunTestsSandbox 在 fs.mkdtempSync(os.tmpdir() + 固定前缀) 生成的
# 临时目录下，用测试硬编码的文件名搭最小沙箱（桩 test_suites.js / scripts/check-deps.js / 套件），
# 目录与文件名均为测试常量、无外部净输入，静态路径注入告警属误报。
#
# check-version.js 是版本三方一致性闸门（本地/CI 工具，不进入生产运行时）：
# 读取路径只由模块常量（path.join(__dirname, '字面量')）组成，package.json 用字面量 require，
# 不接受任何入参参与路径构造，无外部净输入——「动态构造文件/路径信息」「非字面量 require」等
# 静态告警属误报（与 run_mutation.js / scripts/check-mutation-ranges.js 同类工具脚本同一处理）。
# 注：本次收口只加了补丁段校验；判定逻辑已收敛为纯函数 checkVersionValues() 供 test_check_version.js
# 直接断言。
#
# test_check_version.js 的 CLI 契约用例（v3.274 新增）用 fs.mkdtempSync(os.tmpdir() + 固定前缀 'cvcli-')
# 建临时目录，把 check-version.js 复制进去并写入测试硬编码的 xbk_function_v3.js / CHANGELOG.md /
# package.json / exit-spy.js 夹具，再以 spawnSync 在 cwd=临时目录 下跑该副本；路径全部由
# mkdtemp 结果 + 测试硬编码文件名（与 __dirname 常量）拼成，无任何外部净输入参与路径构造，
# 静态路径注入告警属误报。（本条说明同时取代上方 check-version.js 条目里「该测试不碰文件系统」的旧口径。）
#
# scripts/mutation-json.js 是变异报告 JSON 读取工具（本地/CI 工具，不进入生产运行时）：
# readReportJson(reportPath) 的 reportPath 来自 analyze() 对 CLI 传入目录的 readdir 枚举、
# 或测试夹具，非不可信输入；函数内已做 path.resolve() 防御性归一，并以 try/catch 把读取失败
# 转成带路径上下文的可读错误。公开 export 仅为测试复用，不面向不可信输入——
# 「动态构造文件/路径信息」告警在以上调用链上不成立，属误报（与 run_mutation.js /
# scripts/check-mutation-ranges.js / scripts/install-hooks.js 同类工具脚本同一处理）。
#
# test_analyze_artifacts.js 是 .github/analyze-artifacts.js 的子进程回归（R6 新增 A8/A9）：
# writeReport() 在 fs.mkdtempSync(os.tmpdir() + 固定前缀) 建的私有临时目录下，用测试硬编码的
# 子目录名（a / bad / good / lines / cap…）与文件名 mutation.json 拼 artifact 夹具路径；
# 目录前缀、子目录名与文件名全部是测试常量，无任何外部净输入参与路径构造——
# fs.mkdirSync / fs.readFileSync 等的「动态构造文件/路径信息」告警属误报（与 test_mutation_report.js
# / test_status_report.js 同类夹具同一处理）。
#
# test_check_deps.js 是 scripts/check-deps.js 与 run_tests.js 前置依赖门的沙箱回归：
# makeRunTestsSandbox() 在 fs.mkdtempSync(os.tmpdir() + 固定前缀) 下复制真实入口，再用测试硬编码的
# package.json / test_suites.js / stub_suite.js 与 node_modules/<name>/… 搭最小沙箱，
# 目录与文件名均为测试常量，无任何外部净输入参与路径构造——「动态构造文件/路径信息」告警
# 在以上夹具调用链上不成立，属误报。
#
# test_install_hooks.js 是 scripts/install-hooks.js --verify 的只读自检回归：
# makeCase()/writeHooks() 在 fs.mkdtempSync(os.tmpdir() + 固定前缀) 下用测试硬编码的钩子名
# （pre-commit / commit-msg）与 .githooks 常量拼路径，git 一律以**绝对路径**调用（避免经 PATH
# 解析可执行文件）；待检查的权限位也来自测试常量，无任何外部净输入参与路径构造——
# 动态路径注入告警属误报（与上方 scripts/install-hooks.js 条目同一口径）。
#
# test_mutation_json.js 是 scripts/mutation-json.js 的单元测试：
# 用 fs.mkdtempSync(os.tmpdir() + 固定前缀) 加测试硬编码文件名（oversize.json 等）构造报告夹具，
# 并在用例内 monkeypatch fs.fstatSync / fs.readFileSync 计数以证明「先按 fd 取真实大小、再整读」；
# 目录与文件名均为测试常量，无任何外部净输入参与路径构造——动态路径告警属误报。
#
# test_mutation_ranges.js 是 mutation 行段覆盖校验的回归：
# 只读仓库内常量路径（.github/workflows/mutation.yml、xbk_function_v3.js）并对静态清单
# DEFAULT_FILES 逐项做 fs.existsSync 存在性核对，路径不含任何外部输入——
# 「动态构造文件/路径信息」告警属误报（与 scripts/check-mutation-ranges.js 只读仓库内文件同一口径）。
#
# test_qinglong_utils.js 是 qinglong/xbk_push.js 交付形态的回归：
# fs.readFileSync(path.join(__dirname, 'qinglong', 'xbk_push.js')) 的目标只由模块常量 __dirname
# 与仓库内硬编码相对路径拼成，无任何外部净输入参与路径构造——动态路径告警属误报
# （与上方 test_check_version.js / scripts/check-mutation-ranges.js 同类处理）。
exclude_paths:
  - ".github/analyze-artifacts.js"
  - "check-version.js"
  - "scripts/check-mutation-ranges.js"
  - "scripts/install-hooks.js"
  - "scripts/mutation-json.js"
  - "test_ci_skip_suites.js"
  - "run_mutation.js"
  - "test_storage.js"
  - "test_check_mutation_ranges.js"
  - "test_mutation_report.js"
  - "test_run_mutation_internal.js"
  - "test_status_report.js"
  - "test_utils.js"
  - "test_mutation_report_cli.js"
  - "test_run_mutation_cli.js"
  - "test_formatter.js"
  - "test_utils_pure.js"
  - "test_rules_extended.js"
  - "test_message_store_utils.js"
  - "test_sendnotify_pure.js"
  - "test_suite_registry.js"
  - "test_tag_validator.js"
  - "test_check_version.js"
  - "test_analyze_artifacts.js"
  - "test_check_deps.js"
  - "test_install_hooks.js"
  - "test_mutation_json.js"
  - "test_mutation_ranges.js"
  - "test_qinglong_utils.js"
