# SonarCloud 配置
# 测试代码重复率是正常现象（结构相似的断言/边界用例），
# 排除 test_*.js 和 run_*.js 的重复率检查，避免 #100/#101 因重复率超标导致 Quality Gate 失败。
sonar.projectKey=gghhffgfd4yy6_notes2
sonar.organization=gghhffgfd4yy6

# 排除测试文件的重复率检查（测试代码结构相似是正常的）
sonar.cpd.exclusions=test_*.js,run_*.js,scripts/*.js

# 排除测试文件的覆盖率（c8 已在 CI 中单独统计）
sonar.coverage.exclusions=test_*.js,run_*.js

# 源代码编码
sonar.sourceEncoding=UTF-8

# S4036（PATH）误报抑制：scripts/install-hooks.js 需跨平台按名调用系统 git（依赖 PATH），
# 属工具脚本常规做法，非命令注入面。
#
# test_tag_validator.js 同理：它按名调用系统 bash 来执行从 release.yml 抽出的 run: 块（与
# GitHub Actions runner 自身的执行方式一致），脚本内容来自仓库内只读夹具、测试环境不存在
# PATH 劫持面；改成绝对路径会在这台 Android 设备上失效（bash 不在 /bin），而不执行 shell
# 就无法复现 CI 的真实路径，故按同一口径抑制该规则。
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.e1.resourceKey=scripts/install-hooks.js
sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.e2.resourceKey=test_tag_validator.js
