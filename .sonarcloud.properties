# SonarCloud 自动分析（Automatic Analysis）配置
#
# ⚠️ 文件名很关键：本仓库的 SonarCloud 由 GitHub App 自动分析驱动（.github/workflows/ 里没有
#    scanner 步骤），而自动分析只读仓库根目录的 `.sonarcloud.properties`，不读
#    `sonar-project.properties`。历史证据：
#      · #102 添加 sonar.cpd.exclusions 后，新代码重复率不降反升（18.0 → 22.1）；
#      · #141 为 test_notify.js 添加的 S1523 忽略条目在 8941a64 分析里未生效（issue 仍 OPEN）。
#    本文件由 sonar-project.properties 更名而来。⚠️ 更正（2026-09-16）：更名只让
#    **scope 类设置**（如 sonar.cpd.exclusions）真正生效；下面那些 issue 忽略条目**至今无效**，
#    且永远不会在本文件里生效——原因见「⚠️⚠️ 注意」。
#
# 自动分析下 sonar.projectKey / sonar.organization 由 App 绑定提供，无需在此声明；将来若改为
# 在 CI 里自跑 scanner，需把它们补回：
#   sonar.projectKey   = gghhffgfd4yy6_notes2
#   sonar.organization = gghhffgfd4yy6-1
# ⚠️ 组织 key ≠ 组织「显示名」，别按名字填：API 返回 organizations[].key=gghhffgfd4yy6-1、
#    .name=gghhffgfd4yy6；旧注释记的 gghhffgfd4yy6 是显示名，**真 key 带 -1 后缀**。
#    2026-09-16 对 api/issues/search 实测（仅换 organization，项目 key 不变）：
#      · organization=gghhffgfd4yy6-1 → total=15（正确）
#      · 省略 organization            → total=15（读接口可省，写 CI 配置时不能写错）
#      · organization=gghhffgfd4yy6   → total=0 且不报错，极易被读成「零问题」
#    校验型接口（如 api/issues/authors）则会明确报 No organization with key 'gghhffgfd4yy6'。
# 原文件里的 sonar.coverage.exclusions / sonar.sourceEncoding 在自动分析下无对应能力
# （覆盖率由 CI 的 c8 单独统计），故不再保留。

# 测试代码结构相似（断言/边界用例）属正常现象，不计入重复率；scripts/ 为本地与 CI 工具脚本。
sonar.cpd.exclusions=test_*.js,**/test_*.js,run_*.js,**/run_*.js,scripts/*.js,**/scripts/*.js

# ⚠️⚠️ 注意（2026-09-16 查证，此前记载有误）：以下 e1/e2 两条**从未生效，且在此文件里不可能生效**。
#   官方《Automatic analysis》文档列出本文件支持的属性全集，仅：
#     sonar.sources / sonar.exclusions / sonar.inclusions / sonar.tests / sonar.test.exclusions /
#     sonar.test.inclusions / sonar.sourceEncoding / sonar.cpd.exclusions / sonar.python.version /
#     sonar.cfamily.reportingCppStandardOverride
#   `sonar.issue.ignore.multicriteria` 属**多值属性**，不在其中。SonarSource 员工 Colin 在
#   community.sonarsource.com/t/where-can-i-find-documentation-for-multi-value-properties/113106
#   明确回复：「only very few settings can be set in a .sonarcloud.properties file… don't include
#   any multi-value properties… you'll have to set these multi-value properties in the UI」。
#   同帖另一用户实测：加进该文件后「they do not appear in the context」。
#   旁证（本仓库实证）：sonar.cpd.exclusions 确实生效——被排除文件重复行全为 0，未排除的
#   xbk_sendNotify_slim.js 独占 44 行 = 19619 ncloc 的 0.224%，对上 SonarCloud 报的 0.2%。
#   → 所以 #141 的 S1523 一直 OPEN，**与文件名无关**，纯粹是这个属性不被支持。
#   ✅ 真实的 issue 忽略已设在 **SonarCloud 项目级设置**（UI 的 Ignore Issues on Multiple
#      Criteria，或 api/settings/set），改/删本文件里的 e1/e2 不会影响它。当前项目级为：
#          sc1  javascript:S5332 @ test_app.js
#          sc2  javascript:S5332 @ test_notify.js
#          sc3  javascript:S7739 @ test_notify.js
#          sc4  javascript:S2245 @ test_app.js
#          sc5  javascript:S3403 @ test_app.js
#      另有 xbk_sendNotify_slim.js:1437（javascript:S3403）按**单条 issue** 标记了 False Positive。
#   ⚠️ 以下 e1/e2 三行**保留仅作将来切到 CI 分析时的备忘**——CI（sonar-project.properties +
#      sonar-scanner）才解析多值属性。别再指望它们在自动分析下起作用。

# S4036（PATH）误报抑制：scripts/install-hooks.js 需跨平台按名调用系统 git（依赖 PATH），
# 属工具脚本常规做法，非命令注入面。
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.e1.resourceKey=scripts/install-hooks.js

# S1523（动态执行/危险协议）误报抑制：test_notify.js 的用例载荷刻意包含 javascript: 协议，
# 用来断言「危险协议会被统一安全入口清洗」——它是被测数据而不是被执行的代码。
# 注意：该条已在源码侧规避（载荷改为拼接构造，源码不再出现该字面量），本条目为第二道保险。
sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S1523
sonar.issue.ignore.multicriteria.e2.resourceKey=test_notify.js
