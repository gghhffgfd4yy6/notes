version: '1.0'
name: master-pipeline
displayName: MasterPipeline
triggers:
  trigger: auto
  push:
    branches:
      include:
      - master
stages:
- name: test
  displayName: 全量测试
  strategy: naturally
  trigger: auto
  steps:
  - step: build@nodejs
    name: build_nodejs
    displayName: Nodejs 构建与测试
    nodeVersion: 16.14.2
    commands:
    - echo "=== 环境检查: 提交=$(git log -1 --format=%H) node=$(node -v) ==="
    - ls node_modules/got/index.js && echo "got 存在"
    - git checkout -- node_modules/got 2>/dev/null || echo "checkout got 无变化"
    - node run_tests.js
notify: []
