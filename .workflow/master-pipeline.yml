# ═══════════════════════════════════════════════════════════════════
# 【用途声明】这是 Gitee Go 平台流水线（非 GitHub Actions），由 Gitee 侧
# 私有仓 origin（hdjjdj/rikka-hub）使用。分支名 master 对应该仓库的
# Gitee 主分支（master），语义正确，勿改为 main。
#
# GitHub 侧主质量门禁是 .github/workflows/test.yml（on: main），
# 本文件与 GitHub CI 无重复执行关系（不同平台、不同仓库侧）。
# 若 Gitee Go 流水线停用，可整体删除本文件；当前保留。
# ═══════════════════════════════════════════════════════════════════
version: '1.0'
name: master-pipeline
displayName: MasterPipeline
triggers:
  trigger: auto
  push:
    branches:
      include:
      - master
stages:
- name: lint
  displayName: ① Lint + 版本一致性
  strategy: naturally
  trigger: auto
  steps:
  - step: build@nodejs
    name: lint
    displayName: standard 规范检查
    nodeVersion: 20.19.0
    commands:
    - npm install --ignore-scripts
    - npm run lint

- name: version-gate
  displayName: ② 版本三方一致性闸门
  strategy: naturally
  trigger: auto
  steps:
  - step: build@nodejs
    name: check_version
    displayName: 文件头↔CHANGELOG↔package.json
    nodeVersion: 20.19.0
    commands:
    - npm install --ignore-scripts
    - node check-version.js

- name: unit-test
  displayName: ③ 单元测试 test_filter.js
  strategy: naturally
  trigger: auto
  steps:
  - step: build@nodejs
    name: test_filter
    displayName: 运行 test_filter.js（单元测试）
    nodeVersion: 20.19.0
    commands:
    - npm install --ignore-scripts
    - npm run test:filter
  - step: build@nodejs
    name: test_mutation_json
    displayName: mutation-json 超大报告解析回归
    nodeVersion: 20.19.0
    commands:
    - npm install --ignore-scripts
    - npm run test:mutation-json

- name: integration-test
  displayName: ④ 集成测试（并行 + 串行完整）
  strategy: naturally
  trigger: auto
  steps:
  - step: build@nodejs
    name: test_app
    displayName: test_app_p.js（并行调度）
    nodeVersion: 20.19.0
    commands:
    - npm install --ignore-scripts
    - npm run test:app
  - step: build@nodejs
    name: test_app_serial
    displayName: test_app.js（串行完整验证）
    nodeVersion: 20.19.0
    commands:
    - npm install --ignore-scripts
    - npm run test:app:serial

- name: notify-test
  displayName: ⑤ 通道测试 test_notify.js
  strategy: naturally
  trigger: auto
  steps:
  - step: build@nodejs
    name: test_notify
    displayName: 运行 test_notify.js（通道测试）
    nodeVersion: 20.19.0
    commands:
    - npm install --ignore-scripts
    - npm run test:notify

- name: resident-test
  displayName: ⑥ 常驻回归（循环/失败策略/DNS/TLS/延迟加载）
  strategy: naturally
  trigger: auto
  steps:
  - step: build@nodejs
    name: test_loop
    displayName: test_loop.js（常驻循环）
    nodeVersion: 20.19.0
    commands:
    - npm install --ignore-scripts
    - npm run test:loop
  - step: build@nodejs
    name: test_failure_policy
    displayName: test_failure_policy.js（失败分类）
    nodeVersion: 20.19.0
    commands:
    - npm install --ignore-scripts
    - npm run test:failure-policy
  - step: build@nodejs
    name: test_dns
    displayName: test_dns_cache.js（DNS 失效）
    nodeVersion: 20.19.0
    commands:
    - npm install --ignore-scripts
    - npm run test:dns
  - step: build@nodejs
    name: test_tls_prewarm
    displayName: test_tls_prewarm.js（TLS 预热）
    nodeVersion: 20.19.0
    commands:
    - npm install --ignore-scripts
    - npm run test:tls-prewarm
  - step: build@nodejs
    name: test_lazy
    displayName: test_lazy_notify.js（延迟加载）
    nodeVersion: 20.19.0
    commands:
    - npm install --ignore-scripts
    - npm run test:lazy

- name: summary
  displayName: ⑦ 汇总（全过才到这一步）
  strategy: naturally
  trigger: auto
  steps:
  - step: build@nodejs
    name: summary_ok
    displayName: 打印通过摘要
    nodeVersion: 20.19.0
    commands:
    - echo "✅ 全部门禁通过：lint + 版本闸门 + 单元 + 集成(并行/串行) + 通道 + 常驻回归"
    - echo "📊 失败定位：Gitee Go 日志中搜索 ❌ 即为失败测试名（各测试文件末尾打印失败清单）"
notify: []
# 说明：notify 可按 Gitee Go 平台格式配置失败通知（webhook/邮件），平台格式变化时更新。
