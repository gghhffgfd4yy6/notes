# ═══════════════════════════════════════════════════════════════════
# 【用途声明】这是 Gitee Go 平台流水线（非 GitHub Actions），由 Gitee 侧
# 私有仓 origin（hdjjdj/rikka-hub）使用。分支名 master 对应该仓库的
# Gitee 主分支（master），语义正确，勿改为 main。
#
# GitHub 侧主质量门禁是 .github/workflows/test.yml（on: main），
# 本文件与 GitHub CI 无重复执行关系（不同平台、不同仓库侧）。
# 若 Gitee Go 流水线停用，可整体删除本文件；当前保留。
# ═══════════════════════════════════════════════════════════════════
version: '1.0'
name: master-pipeline
displayName: MasterPipeline
triggers:
  trigger: auto
  push:
    branches:
      include:
      - master
stages:
- name: lint
  displayName: ① Lint + 版本一致性
  strategy: naturally
  trigger: auto
  steps:
  - step: build@nodejs
    name: lint
    displayName: standard 规范检查
    nodeVersion: 22.22.2
    commands:
    - npm install --ignore-scripts
    - npm run lint

- name: version-gate
  displayName: ② 版本三方一致性闸门
  strategy: naturally
  trigger: auto
  steps:
  - step: build@nodejs
    name: check_version
    displayName: 文件头↔CHANGELOG↔package.json
    nodeVersion: 22.22.2
    commands:
    - npm install --ignore-scripts
    - node check-version.js

- name: unit-test
  displayName: ③ 单元测试（test_filter / mutation-json / 全量 run_unit_tests.js）
  strategy: naturally
  trigger: auto
  steps:
  - step: build@nodejs
    name: test_filter
    displayName: 运行 test_filter.js（单元测试）
    nodeVersion: 22.22.2
    commands:
    - npm install --ignore-scripts
    - npm run test:filter
  - step: build@nodejs
    name: test_mutation_json
    displayName: mutation-json 超大报告解析回归
    nodeVersion: 22.22.2
    commands:
    - npm install --ignore-scripts
    - npm run test:mutation-json
  - step: build@nodejs
    name: test_unit
    displayName: 全量单元测试 run_unit_tests.js（25 套件兜底防漏网）
    nodeVersion: 22.22.2
    commands:
    - npm install --ignore-scripts
    - npm run test:unit

- name: integration-test
  displayName: ④ 集成测试（并行 + 串行完整）
  strategy: naturally
  trigger: auto
  steps:
  - step: build@nodejs
    name: test_app
    displayName: test_app_p.js（并行调度）
    nodeVersion: 22.22.2
    commands:
    - npm install --ignore-scripts
    - npm run test:app
  - step: build@nodejs
    name: test_app_serial
    displayName: test_app.js（串行完整验证）
    nodeVersion: 22.22.2
    commands:
    - npm install --ignore-scripts
    - npm run test:app:serial

- name: notify-test
  displayName: ⑤ 通道测试 test_notify.js
  strategy: naturally
  trigger: auto
  steps:
  - step: build@nodejs
    name: test_notify
    displayName: 运行 test_notify.js（通道测试）
    nodeVersion: 22.22.2
    commands:
    - npm install --ignore-scripts
    - npm run test:notify

- name: resident-test
  displayName: ⑥ 常驻回归（循环/失败策略/DNS/TLS/延迟加载）
  strategy: naturally
  trigger: auto
  steps:
  - step: build@nodejs
    name: test_loop
    displayName: test_loop.js（常驻循环）
    nodeVersion: 22.22.2
    commands:
    - npm install --ignore-scripts
    - npm run test:loop
  - step: build@nodejs
    name: test_failure_policy
    displayName: test_failure_policy.js（失败分类）
    nodeVersion: 22.22.2
    commands:
    - npm install --ignore-scripts
    - npm run test:failure-policy
  - step: build@nodejs
    name: test_dns
    displayName: test_dns_cache.js（DNS 失效）
    nodeVersion: 22.22.2
    commands:
    - npm install --ignore-scripts
    - npm run test:dns
  - step: build@nodejs
    name: test_tls_prewarm
    displayName: test_tls_prewarm.js（TLS 预热）
    nodeVersion: 22.22.2
    commands:
    - npm install --ignore-scripts
    - npm run test:tls-prewarm
  - step: build@nodejs
    name: test_lazy
    displayName: test_lazy_notify.js（延迟加载）
    nodeVersion: 22.22.2
    commands:
    - npm install --ignore-scripts
    - npm run test:lazy

- name: omitted-suites
  displayName: ⑦ 遗漏套件门禁（CLI/青龙常驻/青龙诊断/状态面板/变异范围）
  strategy: naturally
  trigger: auto
  steps:
  # 这 6 个套件被 run_unit_tests.js 跳过（integration / mutationSkip），须在此显式覆盖，
  # 否则相关回归可带病通过 PR（对照 .github/workflows/test.yml 的同名步骤）。
  # Node 取 22.22.2（与 package.json engines、GitHub test.yml 一致）。
  # 环境前置（勿把本 stage 变成“全绿”环境）：test_cli.js:19 断言 --check 在缺依赖/未配通知时
  # 应返回非零（qinglong/xbk_push.js 的 runCheck 对应返回 1），其错误输出须匹配
  # /Node.js 版本/、/re2 原生模块/、/通知通道/。runCheck 只有在【Node≥22、re2 可加载、
  # 且已配置 ≥1 个通知通道】全部满足时才返回 0；npm install --ignore-scripts 不构建 re2，
  # 且本 stage 未配置通知通道，故 --check 必然返回非零，恰好满足该断言。
  # 反之，若让本环境“全绿”（补齐 re2 且配置通知通道），--check 将返回 0，test_cli.js 反而
  # assert.fail 而失败——故本 stage 不得执行 test.yml 的 re2 安装步骤，也不要注入通知配置。
  # （仅补齐 re2、但不配置通知通道时，--check 仍返回非零，本套件仍通过。）
  # test_qinglong_runcheck.js 的“全部通过”用例已用 withHealthyEnv mock 隔离 Node/got/re2 探测。
  - step: build@nodejs
    name: test_cli
    displayName: test_cli.js（青龙命令行 --check/--status）
    nodeVersion: 22.22.2
    commands:
    - npm install --ignore-scripts
    - npm run test:cli
  - step: build@nodejs
    name: test_qinglong_resident
    displayName: test_qinglong_resident.js（青龙常驻 refreshConnections/runResident）
    nodeVersion: 22.22.2
    commands:
    - npm install --ignore-scripts
    - npm run test:qinglong-resident
  - step: build@nodejs
    name: test_qinglong_runcheck
    displayName: test_qinglong_runcheck.js（青龙诊断 --check 五种返回码）
    nodeVersion: 22.22.2
    commands:
    - npm install --ignore-scripts
    - npm run test:qinglong-runcheck
  - step: build@nodejs
    name: test_status
    displayName: test_status.js（状态面板只读聚合）
    nodeVersion: 22.22.2
    commands:
    - npm install --ignore-scripts
    - npm run test:status
  - step: build@nodejs
    name: test_check_mutation_ranges
    displayName: test_check_mutation_ranges.js（变异范围校验，mutationSkip）
    nodeVersion: 22.22.2
    commands:
    - npm install --ignore-scripts
    - npm run test:check-mutation-ranges
  - step: build@nodejs
    name: test_mutation_ranges_unit
    displayName: test_mutation_ranges.js（变异范围单元，mutationSkip）
    nodeVersion: 22.22.2
    commands:
    - npm install --ignore-scripts
    - npm run test:mutation-ranges-unit

- name: summary
  displayName: ⑧ 汇总（全过才到这一步）
  strategy: naturally
  trigger: auto
  steps:
  - step: build@nodejs
    name: summary_ok
    displayName: 打印通过摘要
    nodeVersion: 22.22.2
    commands:
    - echo "✅ 全部门禁通过：lint + 版本闸门 + 单元 + 集成(并行/串行) + 通道 + 常驻回归 + 遗漏套件(CLI/青龙常驻/青龙诊断/状态面板/变异范围)"
    - echo "📊 失败定位：Gitee Go 日志中搜索 ❌ 即为失败测试名（各测试文件末尾打印失败清单）"
notify: []
# 说明：notify 可按 Gitee Go 平台格式配置失败通知（webhook/邮件），平台格式变化时更新。
