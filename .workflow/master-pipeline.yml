version: '1.0'
name: master-pipeline
displayName: MasterPipeline
triggers:
  trigger: auto
  push:
    branches:
      include:
      - master
stages:
- name: test
  displayName: 全量测试
  strategy: naturally
  trigger: auto
  steps:
  - step: build@nodejs
    name: build_nodejs
    displayName: Nodejs 构建与测试
    nodeVersion: 16.14.2
    commands:
    - git checkout -- node_modules/got 2>/dev/null || true
    - node run_tests.js
notify: []
